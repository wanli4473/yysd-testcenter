<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260821gate1"></script>
  <script src="assets/js/page-transit.js?v=20260724p1"></script>
  <title>学生分配 · 管理 · 优益思达</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=20260723read">
  <link rel="stylesheet" href="assets/css/teacher-desk.css?v=20260828olive2">
</head>
<body class="home-minimal teacher-page teacher-layout shell-compact-nav">

  <header class="teacher-mobilebar">
    <button type="button" class="teacher-nav-toggle" data-teacher-nav-toggle aria-controls="teacher-side" aria-expanded="false">菜单</button>
    <span class="teacher-mobilebar__title">学生分配</span>
  </header>
  <div class="teacher-nav-overlay" data-teacher-nav-close hidden></div>

  <div class="teacher-shell">
    <aside class="teacher-side" id="teacher-side" aria-label="导航">
      <div class="teacher-side__head">
        <a href="teacher.html" class="teacher-side__brand">
          <img src="assets/img/logo.svg?v=20260702-logo" alt="">
          <span class="teacher-side__brand-text"><b>优益思达</b><span>教务</span></span>
        </a>
        <button type="button" class="teacher-nav-collapse" data-teacher-nav-collapse aria-pressed="false" aria-label="收起侧栏">‹</button>
      </div>
      <nav class="teacher-side__nav">
        <p class="teacher-side__label">教务</p>
        <a href="teacher.html" class="teacher-side__link" title="我的学生">我的学生</a>
        <a href="teacher-calendar.html" class="teacher-side__link" title="任务日历">任务日历</a>
        <a href="teacher-diagnostic.html" class="teacher-side__link" title="词汇诊断">词汇诊断</a>
        <a href="teacher-vocab-challenge.html" class="teacher-side__link" title="单词闯关">单词闯关</a>
        <a href="admin-assign.html" class="teacher-side__link is-active" title="学生分配">学生分配</a>
      </nav>
      <div class="teacher-side__foot">
        <a class="teacher-side__link teacher-side__account" href="teacher.html" id="nav-auth">个人中心</a>
        <button type="button" class="btn btn--ghost btn--sm nav-persist" id="logout-btn">退出</button>
      </div>
    </aside>

    <div class="teacher-content">
      <section class="minimal-page-head">
        <h1>学生分配</h1>
        <p class="minimal-page-desc">先选择教师，再勾选要分配给他的学生。一名学生可同时属于多位教师。</p>
      </section>

      <main class="minimal-main">
        <div class="admin-assign">
          <label class="auth-field">
            <span>选择教师</span>
            <select id="teacher-select">
              <option value="">加载中…</option>
            </select>
          </label>
          <div class="cal-picker-toolbar">
            <input type="search" id="student-q" placeholder="搜索学生姓名或手机号" autocomplete="off">
            <button type="button" class="btn btn--ghost btn--sm" id="select-all">全选可见</button>
            <button type="button" class="btn btn--ghost btn--sm" id="clear-all">清空勾选</button>
          </div>
          <p class="profile-hint" id="picked-hint">请先选择教师</p>
          <div class="cal-check-list cal-check-list--tall" id="student-list"></div>
          <p class="auth-msg" id="msg" role="status"></p>
          <div class="cal-form__foot" style="justify-content:flex-start;margin-top:16px">
            <button type="button" class="btn btn--primary" id="save-btn" disabled>保存分配</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <footer class="minimal-footer">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达 · 管理</p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260724p1"></script>
  <script src="assets/js/auth.js?v=20260821prof1"></script>
  <script src="assets/js/teacher-shell.js?v=20260828side1"></script>
  <script src="assets/js/admin-assign.js?v=20260714shell"></script>
</body>
</html>
