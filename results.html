          <b>优益思达国际课程中心</b>

      </div>

  <script src="assets/js/config.js?v=20260716nav"></script>
  <script src="assets/js/auth.js?v=20260806report"></script>
  <script src="assets/js/nav.js?v=20260723hub"></script>
  <script src="assets/js/ui.js?v=20260702f"></script>
  <script>
  (function () {
    var Y = window.YYSD;
    var area = document.getElementById("results-area");
    var summaryEl = document.getElementById("results-summary");
    var timelineEl = document.getElementById("results-timeline");

    function render() {
      var store = Y.results();
      var rows = Object.keys(store).map(function (k) { return store[k]; })
        .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });

      if (summaryEl) {
        summaryEl.innerHTML = rows.length ? Y.resultsSummaryHTML(rows, "") : "";
      }

      if (timelineEl) {
        timelineEl.innerHTML = Y.resultsBandTimelineHTML(rows);
        if (window.YYSD_UI_REVEAL) {
          window.YYSD_UI_REVEAL(timelineEl.querySelectorAll(".reveal"));
        }
      }
      if (summaryEl && window.YYSD_UI_REVEAL) {
        window.YYSD_UI_REVEAL(summaryEl.querySelectorAll(".reveal"));
      }

      if (!rows.length) {
        if (timelineEl) timelineEl.innerHTML = "";
        if (summaryEl) summaryEl.innerHTML = "";
        area.innerHTML = '<div class="state state--brand results-empty premium-empty premium-enter">' +
          '<h3>还没有成绩记录</h3>' +
          '<p>完成一份剑桥真题并交卷后，得分和 Band 预估会自动出现在这里。</p>' +
          '<div class="results-empty__actions premium-empty__actions">' +
          '<a class="btn btn--primary pressable" href="zone.html?zone=mock&s=ielts">去做第一套真题 →</a>' +
          '<a class="btn btn--ghost" href="zone.html?zone=study">先去单词区</a>' +
          '</div></div>';
        return;
      }

      var html = '<div class="results-list premium-enter">';
      rows.forEach(function (r) {
        var score = (r.score != null) ? (r.score + (r.total != null ? " / " + r.total : "")) : "—";
        var date = r.date ? new Date(r.date).toLocaleString("zh-CN") : "—";
        var zone = (Y.ZONE[r.zone] || {}).label || "—";
        var subj = (Y.SUBJECT[r.subject] || {}).label || "—";
        var band = r.band != null ? String(r.band) : "—";
        html += '<article class="results-row">' +
          '<div class="results-row__main">' +
            '<h3 class="results-row__title">' + Y.esc(r.title) + '</h3>' +
            '<p class="results-row__meta">' + Y.esc(zone) + ' · ' + Y.esc(subj) + ' · ' + Y.esc(date) + '</p>' +
          '</div>' +
          '<div class="results-row__score">' +
            '<span class="results-row__band">' + Y.esc(band) + '</span>' +
            '<span class="results-row__pts">' + Y.esc(score) + '</span>' +
          '</div>' +
          '<div class="results-row__acts">' +
            '<a class="btn btn--ghost btn--sm" href="exam.html?id=' + encodeURIComponent(r.id) + '">再练一次</a>' +
            '<span class="btn btn--ghost btn--sm is-disabled" title="AI 错题讲解即将上线">查看错题</span>' +
          '</div></article>';
      });
      html += '</div>';
      area.innerHTML = html;
    }

    document.getElementById("clear-btn").addEventListener("click", function () {
      if (confirm("确定清空全部成绩记录吗？此操作不可撤销。")) {
        localStorage.removeItem("yysd:results"); render();
      }
    });

    document.getElementById("year").textContent = new Date().getFullYear();
    render();
  })();
  </script>
  <script src="assets/js/mascot.js?v=20260709a"></script>
</body>
</html>
