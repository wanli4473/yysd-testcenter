<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260722brand"></script>
  <script src="assets/js/page-transit.js?v=20260724p1"></script>
  <title>任务中心 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260724p1">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260724p1">
</head>
<body class="home-minimal page-premium">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="dashboard.html" class="minimal-brand" aria-label="任务中心">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>YYSD International Course Center</span>
        </span>
      </a>
      <nav class="minimal-nav" id="nav" aria-label="主导航">
        <a href="dashboard.html" data-nav="dashboard" class="is-active">待办事项</a>
        <a href="zone.html?zone=study" data-zone="study">单词区</a>
        <a href="zone.html?zone=practice" data-zone="practice">练习区</a>
        <a href="zone.html?zone=mock" data-zone="mock">真题区</a>
        <a href="results.html" data-nav="results">我的成绩</a>
        <a href="login.html" id="nav-auth">登录</a>
      </nav>
    </div>
  </header>

  <section class="minimal-shell minimal-page-head dash-premium-head">
    <p class="dash-premium-eyebrow">Task Center</p>
    <h1 id="dash-hello">任务中心</h1>
    <p class="minimal-page-desc" id="cal-desc">学习日历与近期待办，从这里开始今天的安排。</p>
  </section>

  <div class="minimal-shell" id="dash-focus" hidden></div>

  <main class="minimal-shell minimal-main dash-main bento-grid bento-grid--main-side">
    <section class="dash-section dash-cal-hero bento-panel" aria-label="任务日历" id="dash-calendar">
      <div class="dash-section__head">
        <h2 class="bento-panel__title">任务日历</h2>
        <p class="bento-panel__desc">月历、周视图与待办列表</p>
      </div>
      <div class="teacher-toolbar cal-toolbar">
        <div class="teacher-filters" role="tablist" aria-label="视图切换">
          <button type="button" class="teacher-filter is-active" data-view="month">月历</button>
          <button type="button" class="teacher-filter" data-view="week">周视图</button>
          <button type="button" class="teacher-filter" data-view="agenda">待办列表</button>
        </div>
        <div class="cal-toolbar__acts">
          <button type="button" class="btn btn--ghost btn--sm" id="refresh-btn">刷新</button>
        </div>
      </div>
      <div id="stu-cal-stats" class="teacher-stats"></div>
      <div id="stu-cal-view" class="cal-view">
        <div class="state state--brand"><div class="spinner spinner--brand"></div></div>
      </div>
    </section>

    <aside id="dash-root" class="dash-aside bento-panel bento-panel--md" aria-label="近期待办">
      <div class="state state--brand"><div class="spinner spinner--brand"></div></div>
    </aside>
  </main>

  <div class="cal-modal" id="stu-detail-modal" hidden>
    <div class="cal-modal__backdrop" data-close="1"></div>
    <div class="cal-modal__panel" role="dialog" aria-modal="true" aria-labelledby="stu-detail-title">
      <div class="cal-modal__head">
        <h2 id="stu-detail-title">任务详情</h2>
        <button type="button" class="cal-modal__x" data-close="1" aria-label="关闭">×</button>
      </div>
      <div id="stu-detail-body" class="cal-detail"></div>
      <div class="cal-form__foot" id="stu-detail-actions"></div>
    </div>
  </div>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心
        <span class="site-icp" data-icp></span>
      </p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260724p1"></script>
  <script src="assets/js/auth.js?v=20260731ielts3"></script>
  <script src="assets/js/nav.js?v=20260725realm1"></script>
  <script src="assets/js/ui.js?v=20260723motion"></script>
  <script src="assets/js/dashboard.js?v=20260731cdt1"></script>
  <script src="assets/js/student-calendar.js?v=20260731p1"></script>
</body>
</html>
