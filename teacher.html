<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260821gate1"></script>
  <title>教师端 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=20260821tfix1">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260828ym1">
  <link rel="stylesheet" href="assets/css/teacher-desk.css?v=20260828olive1">
</head>
<body class="home-minimal teacher-page teacher-layout shell-compact-nav page-premium">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="teacher.html" class="minimal-brand" aria-label="教师端">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>教务</span>
        </span>
      </a>
      <nav class="minimal-nav" aria-label="教师快捷">
        <a class="nav-mobile-only" href="teacher.html">我的学生</a>
        <a class="nav-mobile-only" href="teacher-calendar.html">任务日历</a>
        <a class="nav-persist" href="teacher.html" id="nav-auth">个人中心</a>
        <button type="button" class="btn btn--ghost btn--sm nav-persist" id="logout-btn">退出</button>
      </nav>
    </div>
  </header>

  <div class="teacher-shell">
    <aside class="teacher-side" aria-label="教师导航">
      <p class="teacher-side__label">教务</p>
      <a href="teacher.html" class="teacher-side__link is-active">我的学生</a>
      <a href="teacher-diagnostic.html" class="teacher-side__link">词汇诊断</a>
      <a href="teacher-vocab-challenge.html" class="teacher-side__link">单词闯关</a>
      <a href="teacher-calendar.html" class="teacher-side__link">任务日历</a>
      <a href="admin-assign.html" class="teacher-side__link" data-admin-only hidden>学生分配</a>
      <a href="platform.html" class="teacher-side__link" data-platform-only hidden>平台主控台</a>
    </aside>

    <div class="teacher-content">
      <section class="minimal-page-head" id="roster-head">
        <div class="minimal-crumb">教师端</div>
        <div class="minimal-eyebrow">MY STUDENTS</div>
        <div class="teacher-head-row">
          <div class="teacher-head-avatar-wrap">
            <div class="profile-avatar teacher-head-avatar" id="teacher-avatar" aria-hidden="true">—</div>
            <label class="profile-avatar__btn">
              更换头像
              <input type="file" id="teacher-avatar-input" accept="image/jpeg,image/png,image/webp" hidden>
            </label>
            <p class="auth-msg" id="teacher-avatar-msg" role="status"></p>
          </div>
          <div>
            <h1>我的学生</h1>
            <p class="minimal-page-desc" id="teacher-welcome">加载中…</p>
          </div>
        </div>
      </section>

      <section class="minimal-page-head" id="student-head" hidden>
        <div class="minimal-crumb"><a href="teacher.html">我的学生</a> <span class="crumb-sep" aria-hidden="true">/</span> 学生主页</div>
        <div class="minimal-eyebrow">STUDENT</div>
        <div class="teacher-head-row">
          <div class="profile-avatar teacher-head-avatar" id="student-avatar" aria-hidden="true">—</div>
          <div>
            <h1 id="student-title">学生</h1>
            <p class="minimal-page-desc" id="student-sub"></p>
          </div>
        </div>
      </section>

      <main class="minimal-main" id="roster-main">
        <div class="teacher-toolbar">
          <label class="teacher-search">
            <span class="visually-hidden">搜索学生</span>
            <input type="search" id="student-search" placeholder="搜索用户名或手机号" autocomplete="off">
          </label>
          <button type="button" class="btn btn--ghost btn--sm" id="refresh-btn">刷新</button>
        </div>
        <div id="teacher-students" class="teacher-students">
          <div class="state state--brand"><div class="spinner spinner--brand"></div></div>
        </div>
      </main>

      <main class="minimal-main" id="student-main" hidden>
        <div class="stu-home">
          <div id="stu-cal" class="stu-home__cal"></div>
          <div id="stu-day" class="stu-home__day"></div>
        </div>
      </main>
    </div>
  </div>

  <footer class="minimal-footer">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心 · 教师端</p>
    </div>
  </footer>

  <div class="cal-modal" id="attempt-modal" hidden>
    <div class="cal-modal__backdrop" data-close-attempt="1"></div>
    <div class="cal-modal__panel cal-modal__panel--wide" role="dialog" aria-modal="true" aria-labelledby="attempt-modal-title">
      <div class="cal-modal__head">
        <h2 id="attempt-modal-title">做题记录</h2>
        <button type="button" class="cal-modal__x" data-close-attempt="1" aria-label="关闭">×</button>
      </div>
      <div id="attempt-body" class="cal-detail"></div>
      <div class="cal-form__foot">
        <button type="button" class="btn btn--ghost" data-close-attempt="1">关闭</button>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js?v=20260819mode2"></script>
  <script src="assets/js/auth.js?v=20260821prof1"></script>
  <script src="assets/js/teacher-auth.js?v=20260821gate1"></script>
  <script src="assets/js/teacher-mode.js?v=20260821gate1"></script>
  <script src="assets/js/ui.js?v=20260702f"></script>
  <script src="assets/js/teacher.js?v=20260828desk2"></script>
</body>
</html>
