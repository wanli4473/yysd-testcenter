<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260707a">
</head>
<body class="home-minimal">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="index.html" class="minimal-brand" aria-label="优益思达国际课程中心首页">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>YYSD International Course Center</span>
        </span>
      </a>
      <nav class="minimal-nav" id="nav" aria-label="主导航">
        <a href="zone.html?zone=study">学习区</a>
        <a href="zone.html?zone=practice">练习区</a>
        <a href="zone.html?zone=mock">模考区</a>
        <a href="results.html">我的成绩</a>
        <a href="login.html" id="nav-auth" class="is-active">登录</a>
      </nav>
    </div>
  </header>

  <main class="minimal-shell minimal-main auth-main">
    <section class="auth-card reveal">
      <div class="minimal-eyebrow">LOGIN</div>
      <h1 class="auth-card__title">手机号登录</h1>
      <p class="auth-card__desc">登录后可使用个人中心；学习记录云端同步功能将在后续版本开放。</p>

      <form class="auth-form" id="login-form" novalidate>
        <label class="auth-field">
          <span>手机号</span>
          <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="11 位中国大陆手机号" required>
        </label>
        <label class="auth-field auth-field--row">
          <span>验证码</span>
          <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" required>
          <button type="button" class="btn btn--ghost btn--sm" id="send-btn">获取验证码</button>
        </label>
        <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn--primary btn--block pressable">登录</button>
      </form>

      <p class="auth-legal">
        登录即表示同意
        <a href="agreement.html">《用户服务协议》</a>
        与
        <a href="privacy.html">《隐私政策》</a>
      </p>
    </section>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心
        <span class="site-icp" data-icp></span>
      </p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260707a"></script>
  <script src="assets/js/auth.js?v=20260707a"></script>
  <script src="assets/js/ui.js?v=20260702f"></script>
  <script>
  (function () {
    var A = window.YYSD_AUTH;
    var form = document.getElementById("login-form");
    var phoneEl = document.getElementById("phone");
    var codeEl = document.getElementById("code");
    var sendBtn = document.getElementById("send-btn");
    var msgEl = document.getElementById("msg");
    var next = new URLSearchParams(location.search).get("next") || "profile.html";
    var cooldown = 0;
    var tick;

    if (A.getToken()) {
      location.replace(next.indexOf("login") !== -1 ? "profile.html" : next);
      return;
    }

    document.getElementById("year").textContent = new Date().getFullYear();

    function showMsg(text, ok) {
      msgEl.textContent = text || "";
      msgEl.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    function startCooldown(sec) {
      cooldown = sec;
      sendBtn.disabled = true;
      tick = setInterval(function () {
        cooldown -= 1;
        sendBtn.textContent = cooldown > 0 ? cooldown + "s" : "获取验证码";
        if (cooldown <= 0) {
          clearInterval(tick);
          sendBtn.disabled = false;
        }
      }, 1000);
    }

    sendBtn.addEventListener("click", function () {
      var phone = phoneEl.value.trim();
      showMsg("");
      A.api("/api/auth/send-code", { method: "POST", body: { phone: phone } })
        .then(function () {
          showMsg("验证码已发送，请查收短信。", true);
          startCooldown(60);
        })
        .catch(function (e) { showMsg(e.message); });
    });

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      showMsg("");
      A.api("/api/auth/login", {
        method: "POST",
        body: { phone: phoneEl.value.trim(), code: codeEl.value.trim() }
      })
        .then(function (d) {
          A.setToken(d.token);
          location.href = next;
        })
        .catch(function (e) { showMsg(e.message); });
    });
  })();
  </script>
</body>
</html>
