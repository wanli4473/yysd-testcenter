<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260716side">
</head>
<body class="home-minimal">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="index.html" class="minimal-brand" aria-label="优益思达国际课程中心首页">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>YYSD International Course Center</span>
        </span>
      </a>
      <nav class="minimal-nav" id="nav" aria-label="主导航">
        <a href="dashboard.html" data-nav="dashboard">待办事项</a>
        <a href="zone.html?zone=study" data-zone="study">单词区</a>
        <a href="zone.html?zone=practice" data-zone="practice">练习区</a>
        <a href="zone.html?zone=mock" data-zone="mock">真题区</a>
        <a href="results.html" data-nav="results">我的成绩</a>
        <a href="login.html" id="nav-auth">登录</a>
      </nav>
    </div>
  </header>

  <main class="minimal-shell minimal-main auth-main">
    <div class="auth-layout">
      <aside class="auth-aside reveal" aria-label="平台介绍">
        <div class="auth-aside__logo" aria-hidden="true">
          <img src="assets/img/logo.svg?v=20260702-logo" alt="">
        </div>
        <span class="auth-aside__eyebrow">YYSD · IELTS</span>
        <h2 class="auth-aside__title">学习 · 练习 · 模考<br>一站完成</h2>
        <p class="auth-aside__desc" id="aside-desc">使用手机号与密码登录；新用户请先注册并设置密码。</p>
        <ul class="auth-aside__points">
          <li>剑桥雅思真题模考</li>
          <li>成绩云端同步</li>
          <li>阅读高亮与笔记</li>
        </ul>
      </aside>
      <section class="auth-card reveal">
        <div class="auth-tabs">
          <span class="auth-tabs__item is-active">登录</span>
          <a class="auth-tabs__item" href="register.html">注册</a>
        </div>
        <h1 class="auth-card__title">账号登录</h1>
        <p class="auth-card__desc" id="card-desc">使用注册时的手机号和密码登录；教师账号也可在此登录。</p>

        <form class="auth-form" id="login-form" novalidate>
          <label class="auth-field">
            <span>手机号</span>
            <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="11 位中国大陆手机号" required>
          </label>
          <label class="auth-field">
            <span>密码</span>
            <input type="password" id="password" autocomplete="current-password" minlength="6" maxlength="64" placeholder="至少 6 位" required>
          </label>
          <p class="auth-forgot"><a href="forgot-password.html">忘记密码？</a></p>
          <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn--primary btn--block pressable">登录</button>
        </form>

        <p class="auth-legal">
          还没有账号？<a href="register.html" id="reg-link">立即注册</a>
          · <a href="teacher-login.html">教师入口</a>
          · 登录即表示同意
          <a href="agreement.html">《用户服务协议》</a>
          与
          <a href="privacy.html">《隐私政策》</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心
        <span class="site-icp" data-icp></span>
      </p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260716nav"></script>
  <script src="assets/js/auth.js?v=20260722p0"></script>
  <script src="assets/js/nav.js?v=20260716side"></script>
  <script src="assets/js/ui.js?v=20260702f"></script>
  <script>
  (function () {
    var A = window.YYSD_AUTH;
    var form = document.getElementById("login-form");
    var phoneEl = document.getElementById("phone");
    var passwordEl = document.getElementById("password");
    var msgEl = document.getElementById("msg");
    var nextRaw = new URLSearchParams(location.search).get("next") || "dashboard.html";
    var next = A.postLoginPath ? A.postLoginPath(nextRaw) : nextRaw;

    if (A.getToken()) {
      location.replace(A.postLoginPath ? A.postLoginPath(nextRaw) : (A.isTeacher && A.isTeacher() ? "teacher.html" : "dashboard.html"));
      return;
    }

    document.getElementById("year").textContent = new Date().getFullYear();

    if (A.isHqSite && !A.isHqSite()) {
      document.getElementById("aside-desc").textContent =
        "使用手机号与密码登录。新用户请先用学校发放的注册密钥完成注册。";
      document.getElementById("card-desc").textContent =
        "登录使用手机号 + 密码；注册需注册密钥（向学校索取）。";
      document.getElementById("reg-link").textContent = "密钥注册";
    }

    function showMsg(text, ok) {
      msgEl.textContent = text || "";
      msgEl.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    if (new URLSearchParams(location.search).get("reset") === "1") {
      showMsg("密码已重置，请使用新密码登录。", true);
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      showMsg("");
      A.api("/api/auth/login", {
        method: "POST",
        body: { phone: phoneEl.value.trim(), password: passwordEl.value }
      })
        .then(function (d) {
          A.applyLogin(d);
          A.syncScoresFromCloud().finally(function () {
            location.href = A.postLoginPath ? A.postLoginPath(nextRaw) : next;
          });
        })
        .catch(function (e) { showMsg(e.message); });
    });
  })();
  </script>
</body>
</html>
