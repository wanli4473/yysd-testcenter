<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260722brand"></script>
  <script src="assets/js/page-transit.js?v=20260724p1"></script>
  <title>登录 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=20260818mps">
</head>
<body class="home-minimal home-apple-page">

  <header class="minimal-topbar home-chrome-bar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="index.html" class="minimal-brand" aria-label="首页">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>学习中心</b>
          <span>Learning Center</span>
        </span>
      </a>
      <nav class="minimal-nav" id="nav" aria-label="主导航">
        <a href="index.html" data-key="home">首页</a>
        <a href="zone.html?zone=study&s=vocab" data-key="words">单词</a>
        <a href="zone.html?zone=mock&s=ielts" data-key="ielts">雅思</a>
        <a href="alevel.html" data-key="intl">国际课程</a>
        <a href="dashboard.html" data-key="tasks">任务中心</a>
      </nav>
    </div>
  </header>

  <main class="minimal-shell minimal-main auth-main">
    <div class="auth-layout">
      <aside class="auth-aside reveal" aria-label="平台介绍">
        <p class="auth-aside__eyebrow">雅思 · 国际课程</p>
        <h2 class="auth-aside__title">高效备考。<br>清晰路径。<br>稳步提分。</h2>
        <p class="auth-aside__desc" id="aside-desc">使用手机号与密码登录；新用户请先注册并设置密码。</p>
        <ul class="auth-aside__points">
          <li>剑桥雅思真题</li>
          <li>系统背词计划</li>
          <li>任务与进度同步</li>
        </ul>
      </aside>
      <section class="auth-card reveal">
        <div class="auth-tabs">
          <span class="auth-tabs__item is-active">登录</span>
          <a class="auth-tabs__item" href="register.html">注册</a>
        </div>
        <h1 class="auth-card__title">账号登录</h1>
        <p class="auth-card__desc" id="card-desc">使用注册时的手机号和密码登录；教师账号也可在此登录。</p>

        <form class="auth-form" id="login-form" novalidate>
          <label class="auth-field">
            <span>手机号</span>
            <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="11 位中国大陆手机号" required>
          </label>
          <label class="auth-field">
            <span>密码</span>
            <input type="password" id="password" autocomplete="current-password" minlength="6" maxlength="64" placeholder="至少 6 位" required>
          </label>
          <p class="auth-forgot"><a href="forgot-password.html">忘记密码？</a></p>
          <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn--primary btn--block pressable">登录</button>
        </form>

        <p class="auth-legal">
          还没有账号？<a href="register.html" id="reg-link">立即注册</a>
          <span id="teacher-entry-wrap"> · <a href="teacher-login.html" id="teacher-entry-link">教师入口</a></span>
          · 登录即表示同意
          <a href="agreement.html">《用户服务协议》</a>
          与
          <a href="privacy.html">《隐私政策》</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="minimal-footer minimal-footer--rich home-chrome-footer">
    <div class="minimal-shell minimal-footer__inner">
      <div class="minimal-footer__brand">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-footer__logo">
        <div>
          <b>学习中心</b>
          <span>Learning Center</span>
        </div>
      </div>
      <p class="minimal-footer__copy">© <span id="year"></span>
        <a href="agreement.html">用户协议</a> · <a href="privacy.html">隐私政策</a>
        <span class="site-icp" data-icp></span>
      </p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260724p1"></script>
  <script src="assets/js/auth.js?v=20260818mps"></script>
  <script src="assets/js/nav.js?v=20260729admit2"></script>
  <script src="assets/js/ui.js?v=20260723motion"></script>
  <script>
  (function () {
    var A = window.YYSD_AUTH;
    var form = document.getElementById("login-form");
    var phoneEl = document.getElementById("phone");
    var passwordEl = document.getElementById("password");
    var msgEl = document.getElementById("msg");
    var nextRaw = new URLSearchParams(location.search).get("next") || "index.html";
    var next = A.postLoginPath ? A.postLoginPath(nextRaw) : nextRaw;

    if (A.getToken()) {
      location.replace(A.postLoginPath ? A.postLoginPath(nextRaw) : (A.isTeacher && A.isTeacher() ? "teacher.html" : "index.html"));
      return;
    }

    document.getElementById("year").textContent = new Date().getFullYear();

    if (A.isHqSite && !A.isHqSite()) {
      document.getElementById("aside-desc").textContent =
        "使用手机号与密码登录。新用户请先用学校发放的注册密钥完成注册。";
      document.getElementById("card-desc").textContent =
        "手机号 + 密码登录；学生与工作人员账号均在此登录。";
      document.getElementById("reg-link").textContent = "密钥注册";
      var tWrap = document.getElementById("teacher-entry-wrap");
      if (tWrap) tWrap.hidden = true;
    }

    function showMsg(text, ok) {
      msgEl.textContent = text || "";
      msgEl.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    if (new URLSearchParams(location.search).get("reset") === "1") {
      showMsg("密码已重置，请使用新密码登录。", true);
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      showMsg("");
      A.api("/api/auth/login", {
        method: "POST",
        body: { phone: phoneEl.value.trim(), password: passwordEl.value }
      })
        .then(function (d) {
          A.applyLogin(d);
          A.syncScoresFromCloud().finally(function () {
            (window.YYSD_GO || function (h) { location.href = h; })(A.postLoginPath ? A.postLoginPath(nextRaw) : next, "scene");
          });
        })
        .catch(function (e) { showMsg(e.message); });
    });
  })();
  </script>
</body>
</html>
