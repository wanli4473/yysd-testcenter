<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260821gate1"></script>
  <title>任务发布台 · 教师端 · 优益思达</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260801browse2">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260825desk4">
</head>
<body class="home-minimal teacher-page teacher-layout shell-compact-nav page-premium">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="teacher.html" class="minimal-brand" aria-label="教师端">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>Teacher Portal</span>
        </span>
      </a>
      <nav class="minimal-nav" aria-label="教师快捷">
        <a class="nav-mobile-only" href="teacher.html">学情看板</a>
        <a class="nav-mobile-only" href="teacher-calendar.html">任务日历</a>
        <a class="nav-persist" href="teacher.html" id="nav-auth">个人中心</a>
        <button type="button" class="btn btn--ghost btn--sm nav-persist" id="logout-btn">退出</button>
      </nav>
    </div>
  </header>

  <div class="teacher-shell">
    <aside class="teacher-side" aria-label="教师导航">
      <p class="teacher-side__label">COURSE</p>
      <a href="teacher.html" class="teacher-side__link">学情看板</a>
      <a href="teacher-diagnostic.html" class="teacher-side__link">词汇诊断</a>
      <a href="teacher-vocab-challenge.html" class="teacher-side__link">单词闯关</a>
      <a href="teacher-calendar.html" class="teacher-side__link is-active">任务日历</a>
      <a href="admin-assign.html" class="teacher-side__link" data-admin-only hidden>学生分配</a>
      <a href="teacher.html" class="teacher-side__link">个人中心</a>
    </aside>

    <div class="teacher-content">
      <section class="minimal-page-head">
        <div class="minimal-crumb"><a href="teacher.html">教师端</a> <span class="crumb-sep" aria-hidden="true">★</span> 任务日历</div>
        <div class="minimal-eyebrow">TASK CALENDAR</div>
        <h1>任务与日程发布台</h1>
        <p class="minimal-page-desc">布置练习作业、课程或提醒；关联练习须全部完成后才会标记为已完成。</p>
      </section>

      <main class="minimal-main">
        <div class="teacher-toolbar cal-toolbar">
          <div class="teacher-filters" role="tablist" aria-label="视图切换">
            <button type="button" class="teacher-filter is-active" data-view="list">待办列表</button>
            <button type="button" class="teacher-filter" data-view="month">月历</button>
          </div>
          <div class="cal-toolbar__acts">
            <button type="button" class="btn btn--ghost btn--sm" id="refresh-btn">刷新</button>
            <button type="button" class="btn btn--primary btn--sm pressable" id="create-btn">新建任务</button>
          </div>
        </div>

        <div id="cal-stats" class="teacher-stats"></div>
        <div id="cal-view" class="cal-view">
          <div class="state state--brand"><div class="spinner spinner--brand"></div></div>
        </div>
      </main>
    </div>
  </div>

  <div class="cal-modal" id="create-modal" hidden>
    <div class="cal-modal__backdrop" data-close="1"></div>
    <div class="cal-modal__panel cal-modal__panel--desk" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
      <form class="cal-form assign-desk" id="create-form">
        <div class="cal-modal__head">
          <h2 id="create-modal-title">新建任务 / 日程</h2>
          <button type="button" class="cal-modal__x" data-close="1" aria-label="关闭">×</button>
        </div>
        <div class="assign-desk__body">
          <section class="assign-desk__meta">
            <label class="auth-field">
              <span>标题</span>
              <input type="text" id="f-title" maxlength="80" required placeholder="如：本周剑桥听力 Test 1">
            </label>
            <label class="auth-field">
              <span>类型</span>
              <select id="f-type">
                <option value="ASSIGNMENT">练习作业</option>
                <option value="LESSON">课程日程</option>
                <option value="ANNOUNCEMENT">提醒事项</option>
              </select>
            </label>
            <div class="cal-form__row">
              <label class="auth-field">
                <span id="f-start-label">开始 / 上课时间</span>
                <input type="datetime-local" id="f-start">
              </label>
              <label class="auth-field" id="f-due-wrap">
                <span>截止时间</span>
                <input type="datetime-local" id="f-due">
              </label>
            </div>
            <fieldset class="cal-fieldset assign-desk__students">
              <legend>目标学生</legend>
              <div class="assign-desk__students-body">
                <div class="cal-picker-toolbar">
                  <input type="search" id="student-q" placeholder="搜索姓名或手机号" autocomplete="off">
                  <div class="assign-desk__stu-acts">
                    <button type="button" class="btn btn--ghost btn--sm" id="select-all-students">全选</button>
                    <button type="button" class="btn btn--ghost btn--sm" id="clear-students">清空</button>
                  </div>
                </div>
                <div class="cal-check-list" id="student-list"></div>
              </div>
            </fieldset>
          </section>

          <fieldset class="cal-fieldset assign-desk__work" id="exercise-fieldset">
            <legend>关联练习</legend>
            <div class="cal-ex-cats" id="exercise-cats" role="tablist" aria-label="作业类型">
              <button type="button" class="chip is-active" data-ex-cat="vocab">单词</button>
              <button type="button" class="chip" data-ex-cat="part">补弱练习</button>
              <button type="button" class="chip" data-ex-cat="qtype">题型练习</button>
              <button type="button" class="chip" data-ex-cat="scene">场景练习</button>
              <button type="button" class="chip" data-ex-cat="skill">单项模考</button>
              <button type="button" class="chip" data-ex-cat="suite">全套模考</button>
            </div>
            <p class="profile-hint" id="exercise-cat-hint">先选作业类型，再按下钻勾选。</p>
            <div class="cal-ex-browse" id="exercise-browse" hidden>
              <div class="assign-filter-row">
                <span class="assign-filter-label">册</span>
                <div class="cal-ex-cats cal-ex-cats--sub" id="exercise-vol-filter" role="tablist" aria-label="剑桥册"></div>
              </div>
              <div class="assign-filter-row">
                <span class="assign-filter-label">范围</span>
                <div class="cal-ex-cats cal-ex-cats--sub" id="exercise-book-filter" hidden role="tablist" aria-label="词本"></div>
              </div>
              <div class="assign-filter-row">
                <span class="assign-filter-label">Test</span>
                <div class="cal-ex-cats cal-ex-cats--sub" id="exercise-test-filter" role="tablist" aria-label="Test"></div>
              </div>
              <div class="assign-filter-row">
                <span class="assign-filter-label">分类</span>
                <div class="cal-ex-cats cal-ex-cats--sub" id="exercise-skill-filter" hidden role="tablist" aria-label="技能"></div>
              </div>
            </div>
            <div class="cal-picker-toolbar cal-picker-toolbar--ex">
              <input type="search" id="exercise-q" placeholder="或直接搜索：CET-6 / List 3 / c20 t1" autocomplete="off">
            </div>
            <div class="cal-check-list cal-check-list--tall" id="exercise-list"></div>
            <details class="assign-desk__upload">
              <summary>上传自有试卷</summary>
              <label class="auth-field">
                <span>HTML 练习（可选，单文件）</span>
                <input type="file" id="f-html" accept=".html,text/html">
                <p class="profile-hint" id="html-file-hint">上传后优先生效；学生将在站内打开做题。</p>
              </label>
            </details>
          </fieldset>
        </div>
        <p class="auth-msg" id="create-msg" role="status"></p>
        <div class="cal-form__foot">
          <p class="assign-desk__summary">
            <span id="student-picked">已选 0 人</span>
            <span aria-hidden="true"> · </span>
            <span id="exercise-picked">已选 0 份练习</span>
          </p>
          <div class="assign-desk__acts">
            <button type="button" class="btn btn--ghost" data-close="1">取消</button>
            <button type="submit" class="btn btn--primary pressable">发布</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="cal-modal" id="detail-modal" hidden>
    <div class="cal-modal__backdrop" data-close-detail="1"></div>
    <div class="cal-modal__panel cal-modal__panel--wide" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
      <div class="cal-modal__head">
        <h2 id="detail-modal-title">任务详情</h2>
        <button type="button" class="cal-modal__x" data-close-detail="1" aria-label="关闭">×</button>
      </div>
      <div id="detail-body" class="cal-detail"></div>
      <div class="cal-form__foot">
        <button type="button" class="btn btn--ghost" data-close-detail="1">关闭</button>
        <button type="button" class="btn btn--ghost" id="delete-event-btn">删除任务</button>
      </div>
    </div>
  </div>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心 · 教师端</p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260825qtype2"></script>
  <script src="assets/js/auth.js?v=20260821prof1"></script>
  <script src="assets/js/teacher-auth.js?v=20260821gate1"></script>
  <script src="assets/js/teacher-mode.js?v=20260821gate1"></script>
  <script src="assets/js/ui.js?v=20260702f"></script>
  <script src="assets/js/teacher-calendar.js?v=20260825desk5"></script>
</body>
</html>
