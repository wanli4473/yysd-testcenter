<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260722brand"></script>
  <script src="assets/js/page-transit.js?v=20260724p1"></script>
  <title>个人中心 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260723read">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260723read">
</head>
<body class="home-minimal page-premium">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="index.html" class="minimal-brand" aria-label="优益思达国际课程中心首页">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>YYSD International Course Center</span>
        </span>
      </a>
      <nav class="minimal-nav" id="nav" aria-label="主导航">
        <a href="dashboard.html" data-nav="dashboard">待办事项</a>
        <a href="zone.html?zone=study" data-zone="study">单词区</a>
        <a href="zone.html?zone=practice" data-zone="practice">练习区</a>
        <a href="zone.html?zone=mock" data-zone="mock">真题区</a>
        <a href="results.html" data-nav="results">我的成绩</a>
        <a href="login.html" id="nav-auth">登录</a>
      </nav>
    </div>
  </header>

  <section class="minimal-shell minimal-page-head premium-page-head">
    <div class="minimal-crumb"><a href="index.html">首页</a> <span class="crumb-sep" aria-hidden="true">★</span> 个人中心</div>
    <p class="dash-premium-eyebrow">Profile</p>
    <h1>个人中心</h1>
    <p class="minimal-page-desc" id="profile-desc">加载中…</p>
  </section>

  <main class="minimal-shell minimal-main">
    <div class="auth-card reveal" id="profile-card">
      <div class="profile-avatar-block">
        <div class="profile-avatar" id="avatar-preview" aria-hidden="true">—</div>
        <div class="profile-avatar__meta">
          <label class="btn btn--ghost btn--sm pressable profile-avatar__btn">
            更换头像
            <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp" hidden>
          </label>
          <p class="profile-hint">支持 JPG / PNG / WebP，自动裁成方形并压缩。</p>
          <p class="auth-msg" id="avatar-msg" role="status"></p>
        </div>
      </div>
      <dl class="profile-dl">
        <dt>用户名</dt>
        <dd id="p-name-wrap">
          <form class="profile-name-form" id="name-form">
            <input type="text" id="display-name" maxlength="20" placeholder="如：李明 / 雅思2班张三" autocomplete="nickname">
            <button type="submit" class="btn btn--primary btn--sm pressable">保存</button>
          </form>
          <p class="auth-msg" id="name-msg" role="status"></p>
          <p class="profile-hint">设置用户名后，老师可在教师端按姓名查找您的成绩。</p>
        </dd>
        <dt>手机号</dt><dd id="p-phone">—</dd>
        <dt>注册时间</dt><dd id="p-created">—</dd>
        <dt>最近登录</dt><dd id="p-login">—</dd>
      </dl>
      <section class="profile-section" id="password-section">
        <h2 class="profile-section__title">修改密码</h2>
        <form class="auth-form profile-password-form" id="password-form">
          <label class="auth-field">
            <span>当前密码</span>
            <input type="password" id="old-password" autocomplete="current-password" minlength="6" maxlength="64" required>
          </label>
          <label class="auth-field">
            <span>新密码</span>
            <input type="password" id="new-password" autocomplete="new-password" minlength="6" maxlength="64" required>
          </label>
          <label class="auth-field">
            <span>确认新密码</span>
            <input type="password" id="confirm-password" autocomplete="new-password" minlength="6" maxlength="64" required>
          </label>
          <p class="auth-msg" id="pw-msg" role="status"></p>
          <button type="submit" class="btn btn--ghost btn--sm pressable">保存新密码</button>
        </form>
        <p class="profile-hint">忘记密码？<a href="forgot-password.html">短信重置</a></p>
      </section>
      <p class="auth-card__desc" id="profile-note">成绩已与云端同步，可在任意设备登录后查看「我的成绩」。</p>
      <div class="profile-actions">
        <a class="btn btn--primary" id="teacher-link" href="teacher.html" hidden>进入教师端</a>
        <button type="button" class="btn btn--ghost" id="logout-btn">退出登录</button>
      </div>
    </div>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心
        <span class="site-icp" data-icp></span>
      </p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260724p1"></script>
  <script src="assets/js/auth.js?v=20260725realm1"></script>
  <script src="assets/js/nav.js?v=20260725realm1"></script>
  <script src="assets/js/ui.js?v=20260723motion"></script>
  <script>
  (function () {
    var A = window.YYSD_AUTH;
    document.getElementById("year").textContent = new Date().getFullYear();
    if (!A.requireLogin()) return;

    function fmt(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleString("zh-CN", { hour12: false });
      } catch (e) { return iso; }
    }

    function showNameMsg(text, ok) {
      var el = document.getElementById("name-msg");
      el.textContent = text || "";
      el.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    function showPwMsg(text, ok) {
      var el = document.getElementById("pw-msg");
      el.textContent = text || "";
      el.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    function showAvatarMsg(text, ok) {
      var el = document.getElementById("avatar-msg");
      el.textContent = text || "";
      el.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    function renderAvatar(url, phone) {
      var box = document.getElementById("avatar-preview");
      var src = A.avatarSrc(url);
      if (src) {
        box.innerHTML = '<img src="' + src.replace(/"/g, "") + '" alt="">';
        box.classList.add("has-img");
      } else {
        box.textContent = (phone || "").slice(-4) || "·";
        box.classList.remove("has-img");
      }
    }

    A.api("/api/auth/me")
      .then(function (d) {
        var u = d.user;
        document.getElementById("p-phone").textContent = u.phone;
        document.getElementById("p-created").textContent = fmt(u.createdAt);
        document.getElementById("p-login").textContent = fmt(u.lastLoginAt);
        A.setUser({
          phone: u.phone,
          role: u.role || "",
          displayName: u.displayName || u.name || "",
          avatarUrl: u.avatarUrl || ""
        });
        renderAvatar(u.avatarUrl, u.phone);
        if (u.role === "teacher") {
          document.getElementById("p-name-wrap").hidden = true;
          document.getElementById("profile-desc").textContent =
            "教师账号已登录，可上传头像、浏览学生端内容，也可进入教师端查看学情。";
          document.getElementById("profile-note").textContent =
            "教师做练习/模考时成绩不会写入学生云端记录。";
          document.getElementById("teacher-link").hidden = false;
        } else {
          document.getElementById("display-name").value = u.displayName || "";
          document.getElementById("profile-desc").textContent =
            "欢迎回来。请设置用户名与头像，方便老师查找您的学习记录。";
        }
      })
      .catch(function () {
        A.setToken("");
        location.href = "login.html";
      });

    document.getElementById("avatar-input").addEventListener("change", function () {
      var file = this.files && this.files[0];
      this.value = "";
      if (!file) return;
      showAvatarMsg("上传中…");
      A.uploadAvatar(file)
        .then(function (d) {
          renderAvatar(d.avatarUrl, A.getUser().phone);
          showAvatarMsg("头像已更新", true);
        })
        .catch(function (e) { showAvatarMsg(e.message); });
    });

    document.getElementById("name-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      showNameMsg("");
      var name = document.getElementById("display-name").value.trim();
      A.api("/api/auth/profile", { method: "PATCH", body: { displayName: name } })
        .then(function (d) {
          var u = d.user || {};
          document.getElementById("display-name").value = u.displayName || name;
          A.setUser({
            phone: u.phone || A.getUser().phone,
            role: "student",
            displayName: u.displayName || name,
            avatarUrl: u.avatarUrl || A.getUser().avatarUrl || ""
          });
          showNameMsg("用户名已保存", true);
        })
        .catch(function (e) { showNameMsg(e.message); });
    });

    document.getElementById("password-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      showPwMsg("");
      var oldPw = document.getElementById("old-password").value;
      var newPw = document.getElementById("new-password").value;
      var confirmPw = document.getElementById("confirm-password").value;
      if (newPw !== confirmPw) {
        showPwMsg("两次新密码不一致");
        return;
      }
      A.api("/api/auth/change-password", {
        method: "POST",
        body: { oldPassword: oldPw, password: newPw, confirm: confirmPw }
      })
        .then(function () {
          document.getElementById("password-form").reset();
          showPwMsg("密码已修改", true);
        })
        .catch(function (e) { showPwMsg(e.message); });
    });

    document.getElementById("logout-btn").addEventListener("click", function () {
      A.logout();
    });
  })();
  </script>
</body>
</html>
