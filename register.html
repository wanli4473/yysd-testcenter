<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260722brand"></script>
  <script src="assets/js/page-transit.js?v=20260724p1"></script>
  <title>注册 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260724p1">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260724p1">
</head>
<body class="home-minimal">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="index.html" class="minimal-brand" aria-label="优益思达国际课程中心首页">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>YYSD International Course Center</span>
        </span>
      </a>
      <nav class="minimal-nav" id="nav" aria-label="主导航">
        <a href="dashboard.html" data-nav="dashboard">待办事项</a>
        <a href="zone.html?zone=study" data-zone="study">单词区</a>
        <a href="zone.html?zone=practice" data-zone="practice">练习区</a>
        <a href="zone.html?zone=mock" data-zone="mock">真题区</a>
        <a href="results.html" data-nav="results">我的成绩</a>
        <a href="login.html" id="nav-auth">登录</a>
      </nav>
    </div>
  </header>

  <main class="minimal-shell minimal-main auth-main">
    <div class="auth-layout">
      <aside class="auth-aside reveal" aria-label="平台介绍">
        <div class="auth-aside__logo" aria-hidden="true">
          <img src="assets/img/logo.svg?v=20260702-logo" alt="">
        </div>
        <span class="auth-aside__eyebrow">YYSD · IELTS</span>
        <h2 class="auth-aside__title">注册账号<br>开始学习</h2>
        <p class="auth-aside__desc" id="aside-desc">验证手机号后设置登录密码，即可使用全部学习、练习与模考功能。</p>
        <ul class="auth-aside__points" id="aside-points">
          <li>短信验证码注册</li>
          <li>密码登录，安全便捷</li>
          <li>成绩自动云端同步</li>
        </ul>
      </aside>
      <section class="auth-card reveal">
        <div class="auth-tabs">
          <a class="auth-tabs__item" href="login.html">登录</a>
          <span class="auth-tabs__item is-active">注册</span>
        </div>
        <h1 class="auth-card__title">注册账号</h1>
        <p class="auth-card__desc" id="card-desc">每个手机号只能注册一次，请牢记您设置的密码。</p>

        <form class="auth-form" id="register-form" novalidate>
          <label class="auth-field">
            <span>手机号</span>
            <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="11 位中国大陆手机号" required>
          </label>
          <label class="auth-field" id="reg-key-field" hidden>
            <span>注册密钥</span>
            <input type="text" id="reg-key" autocomplete="off" maxlength="120" placeholder="向学校索取的注册密钥">
          </label>
          <label class="auth-field auth-field--row" id="code-field">
            <span>验证码</span>
            <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" required>
            <button type="button" class="btn btn--ghost btn--sm" id="send-btn">获取验证码</button>
          </label>
          <label class="auth-field">
            <span>设置密码</span>
            <input type="password" id="password" autocomplete="new-password" minlength="6" maxlength="64" placeholder="至少 6 位" required>
          </label>
          <label class="auth-field">
            <span>确认密码</span>
            <input type="password" id="confirm" autocomplete="new-password" minlength="6" maxlength="64" placeholder="再次输入密码" required>
          </label>
          <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn--primary btn--block pressable">注册并登录</button>
        </form>

        <p class="auth-legal">
          已有账号？<a href="login.html">去登录</a>
          · 注册即表示同意
          <a href="agreement.html">《用户服务协议》</a>
          与
          <a href="privacy.html">《隐私政策》</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心
        <span class="site-icp" data-icp></span>
      </p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260724p1"></script>
  <script src="assets/js/auth.js?v=20260731ielts2"></script>
  <script src="assets/js/nav.js?v=20260729admit2"></script>
  <script src="assets/js/ui.js?v=20260723motion"></script>
  <script>
  (function () {
    var A = window.YYSD_AUTH;
    var form = document.getElementById("register-form");
    var phoneEl = document.getElementById("phone");
    var codeEl = document.getElementById("code");
    var regKeyEl = document.getElementById("reg-key");
    var passwordEl = document.getElementById("password");
    var confirmEl = document.getElementById("confirm");
    var sendBtn = document.getElementById("send-btn");
    var msgEl = document.getElementById("msg");
    var tenantMode = A.isHqSite && !A.isHqSite();
    var nextRaw = new URLSearchParams(location.search).get("next") || "index.html";
    var next = A.postLoginPath ? A.postLoginPath(nextRaw) : nextRaw;
    var cooldown = 0;
    var tick;

    if (A.getToken()) {
      location.replace(A.postLoginPath ? A.postLoginPath(nextRaw) : "index.html");
      return;
    }

    document.getElementById("year").textContent = new Date().getFullYear();

    if (tenantMode) {
      document.getElementById("reg-key-field").hidden = false;
      var codeField = document.getElementById("code-field");
      codeField.hidden = true;
      codeField.style.display = "none";
      codeEl.required = false;
      codeEl.value = "";
      sendBtn.disabled = true;
      regKeyEl.required = true;
      document.getElementById("aside-desc").textContent =
        "向学校索取注册密钥后，用手机号设置密码即可注册。登录仍用手机号 + 密码。";
      document.getElementById("aside-points").innerHTML =
        "<li>学校发放的注册密钥</li><li>手机号 + 密码登录</li><li>成绩自动云端同步</li>";
      document.getElementById("card-desc").textContent =
        "请向学校管理员索取注册密钥。密钥有次数限制，每个手机号只能注册一次。";
    }

    function showMsg(text, ok) {
      msgEl.textContent = text || "";
      msgEl.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    function startCooldown(sec) {
      cooldown = sec;
      sendBtn.disabled = true;
      tick = setInterval(function () {
        cooldown -= 1;
        sendBtn.textContent = cooldown > 0 ? cooldown + "s" : "获取验证码";
        if (cooldown <= 0) {
          clearInterval(tick);
          sendBtn.disabled = false;
        }
      }, 1000);
    }

    sendBtn.addEventListener("click", function () {
      showMsg("");
      A.api("/api/auth/send-code", {
        method: "POST",
        body: { phone: phoneEl.value.trim(), purpose: "register" }
      })
        .then(function () {
          showMsg("验证码已发送，请查收短信。", true);
          startCooldown(60);
        })
        .catch(function (e) { showMsg(e.message); });
    });

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      showMsg("");
      if (passwordEl.value !== confirmEl.value) {
        showMsg("两次密码不一致");
        return;
      }
      var body = {
        phone: phoneEl.value.trim(),
        password: passwordEl.value,
        confirm: confirmEl.value
      };
      if (tenantMode) body.regKey = regKeyEl.value.trim();
      else body.code = codeEl.value.trim();

      A.api("/api/auth/register", {
        method: "POST",
        body: body
      })
        .then(function (d) {
          A.setToken(d.token);
          A.setUser({ phone: phoneEl.value.trim() });
          A.syncScoresFromCloud().finally(function () {
            (window.YYSD_GO || function (h) { location.href = h; })(A.postLoginPath ? A.postLoginPath(nextRaw) : next, "scene");
          });
        })
        .catch(function (e) { showMsg(e.message); });
    });
  })();
  </script>
</body>
</html>
