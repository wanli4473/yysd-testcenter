# app.youyisida.com — 机考系统静态站（与 youyisida.com 分根目录）
# 必须比 *.youyisida.com 更具体，否则会落到网站根
# 用法：复制到 /etc/nginx/sites-available/app.youyisida.com 并 ln -s 到 sites-enabled

server {
    listen 80;
    server_name app.youyisida.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.youyisida.com;
    root /opt/yysd/app;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/app.youyisida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.youyisida.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ponytail: exam engine + 考场真题仍在网站根，机考系统只挂入口
    location ~ ^/toefl-(reading|listening|writing|speaking|full)\.html$ {
        root /opt/yysd/web;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # 机考 Set 题库在 app 根；完整模考日期卷在网站根。先本站，再回退。
    location /library/toefl/ {
        root /opt/yysd/app;
        add_header Cache-Control "no-cache";
        try_files $uri @web_toefl;
    }
    location @web_toefl {
        root /opt/yysd/web;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /assets/js/kl-mocks.js { alias /opt/yysd/web/assets/js/kl-mocks.js; }
    location = /assets/js/config.js { alias /opt/yysd/web/assets/js/config.js; }
    location = /assets/js/tenant-boot.js { alias /opt/yysd/web/assets/js/tenant-boot.js; }
    location = /assets/js/toefl-reading.js { alias /opt/yysd/web/assets/js/toefl-reading.js; }
    location = /assets/js/toefl-full.js { alias /opt/yysd/web/assets/js/toefl-full.js; }
    location = /assets/js/toefl-lab.js { alias /opt/yysd/web/assets/js/toefl-lab.js; }
    location = /assets/js/toefl-shell.js { alias /opt/yysd/web/assets/js/toefl-shell.js; }
    location = /assets/js/tiku-run.js { alias /opt/yysd/web/assets/js/tiku-run.js; }
    location = /assets/js/toefl-sync.js { alias /opt/yysd/web/assets/js/toefl-sync.js; }
    location = /assets/js/hit-trace.js { alias /opt/yysd/web/assets/js/hit-trace.js; }
    location = /assets/js/toefl-speaking.js { alias /opt/yysd/web/assets/js/toefl-speaking.js; }
    location = /assets/js/toefl-writing.js { alias /opt/yysd/web/assets/js/toefl-writing.js; }
    location = /assets/css/toefl-exam.css { alias /opt/yysd/web/assets/css/toefl-exam.css; }

    location / {
        try_files $uri $uri/ =404;
    }
}
