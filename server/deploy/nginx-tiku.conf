# tiku.youyisida.com — 题库中心静态站（老师端打开；浏览器直打只看到提示）
# 复制到 /etc/nginx/sites-available/tiku.youyisida.com 并 ln -s
# 证书：certbot --nginx -d tiku.youyisida.com
# 安装包不要放官网。需要时放到 /opt/yysd/private/tiku/ 再私下发链接。

server {
    listen 80;
    server_name tiku.youyisida.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tiku.youyisida.com;
    root /opt/yysd/tiku;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tiku.youyisida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiku.youyisida.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~* \.(html|js|css)$ {
        etag off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
