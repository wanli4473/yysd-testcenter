# youyisida.com — 静态站 + 登录门禁（/library 需 cookie）
# HTTPS 块由 certbot 管理；更新后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name youyisida.com www.youyisida.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name youyisida.com www.youyisida.com;
    root /opt/yysd/web;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/youyisida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youyisida.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /data/ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    location ^~ /library/ {
        if ($cookie_yysd_auth != "1") {
            return 302 https://$host/login.html?next=$request_uri;
        }
        try_files $uri =404;
    }

    # Multi-page site: never fall back to index.html (masks missing .js as HTML).
    location / {
        try_files $uri $uri/ =404;
    }
}
