# youyisida.com — 静态站 + 登录门禁（/library 需 cookie）
# 多租户：通配符 *.youyisida.com 指向同一套静态文件
# HTTPS：通配符证书需 DNS 验证，见 docs/multi-tenant.md
# 更新后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name youyisida.com www.youyisida.com *.youyisida.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name youyisida.com www.youyisida.com *.youyisida.com;
    root /opt/yysd/web;
    index index.html;

    # 通配符证书路径（按 certbot 实际目录调整）
    ssl_certificate /etc/letsencrypt/live/youyisida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youyisida.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /data/ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    location ^~ /library/ {
        if ($cookie_yysd_auth != "1") {
            return 302 https://$host/login.html?next=$request_uri;
        }
        # Papers change in place; without this, browsers keep stale HTML/maps.
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 内容上传后台：未登录不可进（页内另有教师/管理员角色校验）
    # ponytail: exact /admin/ must redirect — index module can skip if+try_files
    location = /admin {
        return 302 /admin/index.html;
    }
    location = /admin/ {
        return 302 /admin/index.html;
    }
    location ^~ /admin/ {
        if ($cookie_yysd_auth != "1") {
            return 302 https://$host/login.html?next=$request_uri;
        }
        try_files $uri =404;
    }

    # 校徽走本机静态目录，别进 Next（Next 对 /admission/logos/* 会 400）
    # 目录用 sync-web 之外的路径，避免 rsync --delete 误删；部署：rsync admission/public/logos/ → 此处
    location ^~ /admission/logos/ {
        alias /opt/yysd/school-logos/;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # AI 升学顾问（Next.js @ :3001；暂时仅总部站 youyisida.com）
    location ^~ /admission {
        if ($host !~* ^(youyisida\.com|www\.youyisida\.com)$) {
            return 403;
        }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 12m;
    }

    # 全球大学排名（Next.js @ :3002；暂时仅总部站 youyisida.com）
    location ^~ /rankings {
        if ($host !~* ^(youyisida\.com|www\.youyisida\.com)$) {
            return 403;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # exam.html holds the CONTENT_VER script tag; stale copies pin old papers.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Multi-page site: never fall back to index.html (masks missing .js as HTML).
    location / {
        try_files $uri $uri/ =404;
    }
}
