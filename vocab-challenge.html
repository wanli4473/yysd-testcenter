    .vc-notice {
      margin: 0 0 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eaf5ef;
      border: 1px solid rgba(45, 107, 79, 0.2);
      color: #1f553f;

    .vc-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));

      margin: 16px 0;
    }
    .vc-list-chip {
      display: flex;
      flex-direction: column;
      align-items: center;

      font-size: 13px;
      font-weight: 600;

    .vc-list-chip.is-open { color: #1a2e2a; border-color: #2d6b4f; background: #fff; }
    .vc-list-chip.is-cleared { color: #2d6b4f; background: #eaf5ef; }
    .vc-list-chip.is-current { box-shadow: 0 0 0 2px rgba(45, 107, 79, 0.35); }
    .vc-list-chip.is-today-new { border-color: #2d6b4f; background: #fff; }
    .vc-list-chip.is-today-review { border-color: #b8860b; background: #fffbf0; }
    .vc-list-chip.is-done-today { opacity: 0.72; }
    .vc-day-card {

    .vc-day-tasks { list-style: none; margin: 10px 0 0; padding: 0; }
    .vc-day-task {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid #e8efeb; font-size: 14px;
    }
    .vc-day-task:last-child { border-bottom: 0; }
    .vc-day-task--completed { color: #2d6b4f; }
    .vc-day-task--failed { color: #8a3b2a; }
    .vl-btn-sm { padding: 6px 12px; font-size: 13px; }
    .vc-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .vc-nb-row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid #e8efeb; font-size: 14px;
    }
    .vc-nb-row b { font-size: 15px; }
