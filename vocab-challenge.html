  <style>
    .vc-notice {
      margin: 0 0 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eaf5ef;
      border: 1px solid rgba(45, 107, 79, 0.2);
      color: #1f553f;
      font-size: 14px;
      line-height: 1.5;
    }
    .vc-notice--warn {
      background: #fff6e8;
      border-color: rgba(180, 110, 30, 0.25);
      color: #7a4a12;
    }
    .vc-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 8px;
      margin: 16px 0;
    }
    .vc-list-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 10px 6px;
      border-radius: 12px;
      border: 1px solid #d7e5de;
      background: #f7fbf9;
      font-size: 13px;
      font-weight: 600;
      color: #8a9e96;
    }
    .vc-list-chip.is-open { color: #1a2e2a; border-color: #2d6b4f; background: #fff; }
    .vc-list-chip.is-cleared { color: #2d6b4f; background: #eaf5ef; }
    .vc-list-chip.is-current { box-shadow: 0 0 0 2px rgba(45, 107, 79, 0.35); }
    .vc-meta { color: #5c736b; font-size: 13px; margin: 0 0 8px; }
    .vc-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .vc-nb-row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid #e8efeb; font-size: 14px;
    }
    .vc-nb-row b { font-size: 15px; }
    .vc-quiz-row {
      display: flex;
      gap: 12px 20px;
      align-items: flex-start;
    }
    .vc-quiz-main { flex: 1; min-width: 0; }
    .vc-hp {
      flex: 0 0 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 6px 0 0;
    }
    .vc-hp .star {
      font-size: 26px;
      line-height: 1;
      color: #e2556a;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .vc-hp .star.lost {
      opacity: 0.14;
      transform: scale(0.55);
    }
    @media (max-width: 560px) {
      .vc-hp {
        flex-direction: row;
        flex: none;
        width: 100%;
        justify-content: flex-end;
        gap: 6px;
        padding: 0 0 8px;
        order: -1;
      }
      .vc-quiz-main { flex: 1 1 100%; }
    }
  </style>
</head>
