<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEFL Complete Test</title>
  <script src="assets/js/tenant-boot.js?v=20260904maint1"></script>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/toefl-exam.css?v=20260929toefl6">
  <script src="assets/js/config.js?v=20260929toefl8"></script>
  <script src="assets/js/auth.js?v=20260821gate1"></script>
  <script src="assets/js/toefl-full.js?v=20260929toefl6"></script>
</head>
<body class="exam-ets">
  <header class="ets-bar">
    <div class="ets-bar-left">
      <b>Complete Test</b>
      <span id="mode-tag"></span>
    </div>
    <div class="ets-bar-right">
      <button type="button" disabled>Hide Time</button>
      <button type="button" disabled>Help</button>
      <button type="button" disabled>Back</button>
      <button type="button" disabled>Next</button>
    </div>
  </header>
  <div class="ets-sub"><span id="q-range">Reading → Listening → Writing → Speaking</span></div>

  <section id="intro" class="result hidden">
    <h1 id="intro-title">Complete Test</h1>
    <p>网考顺序固定，四科一次完成，<b>无安排休息</b>。离开某一科后不能返回。</p>
    <p class="sample" style="max-width:640px;margin:16px auto;text-align:left">
      练习：科内可回看、重听、重录；科与科之间可暂停，计时不跑。<br>
      模考：按各科官方时限连考；切换页面或离开窗口则整场作废，四科均不记分。<br>
      阅读、听力当场给出 1–6 预估。写组句自动对错，两篇作文只对照范文。口语不自动估分，提交后请先导出录音。
    </p>
    <p id="start-wrap"></p>
  </section>

  <section id="done" class="result hidden">
    <h1>完整模考已提交</h1>
    <p id="done-copy">口语不估分，故不计算总分。阅读、听力为 1–6 预估。</p>
    <div class="review" id="summary"></div>
    <p><a class="btn" href="zone.html?zone=toefl&amp;s=full">返回完整模考</a></p>
  </section>

  <script>
    (function () {
      var A = window.YYSD_AUTH;
      var F = window.YYSD_TOEFL_FULL;
      var Y = window.YYSD;
      var qs = new URLSearchParams(location.search);
      var mode = qs.get("mode") === "mock" ? "mock" : (qs.get("mode") === "practice" ? "practice" : "");
      var paperId = qs.get("id") || "";
      var view = qs.get("view") || "";
      if (A && A.requireLogin && !A.requireLogin()) return;
      if (!paperId) { location.replace("zone.html?zone=toefl&s=full"); return; }
      var meta = ((Y && Y.TOEFL_FULL) || []).filter(function (p) { return p.id === paperId; })[0];
      if (!meta) { location.replace("zone.html?zone=toefl&s=full"); return; }

      document.title = (meta.title || "Complete Test") + (mode === "mock" ? " · 模考" : mode === "practice" ? " · 练习" : "");
      document.getElementById("mode-tag").textContent = mode === "mock" ? "Mock" : (mode === "practice" ? "Practice" : "");
      document.getElementById("intro-title").textContent = meta.title || "Complete Test";

      function show(el) {
        document.getElementById("intro").classList.add("hidden");
        document.getElementById("done").classList.add("hidden");
        el.classList.remove("hidden");
      }

      function start(m) {
        F.startPack(paperId, m);
        location.replace(F.skillHref(paperId, m, "reading"));
      }

      if (view === "done") {
        var pack = F.load(paperId);
        if (!pack || pack.voided) { location.replace(F.introHref(paperId, mode)); return; }
        var r = pack.sections.reading || {};
        var l = pack.sections.listening || {};
        var w = pack.sections.writing || {};
        var s = pack.sections.speaking || {};
        function row(name, body) {
          return '<div class="review-row"><span>' + name + "</span><span>" + body + "</span></div>";
        }
        var html = "";
        html += row("Reading", r.total != null
          ? (r.score + " / " + r.total + " · 预估 " + r.band + "（0–30 为 " + r.scaled30 + "）")
          : "未完成");
        html += row("Listening", l.total != null
          ? (l.score + " / " + l.total + " · 预估 " + l.band + "（0–30 为 " + l.scaled30 + "）")
          : "未完成");
        html += row("Writing", w.total != null
          ? ("句子 " + w.score + " / " + w.total + " · 两篇作文不自动估分")
          : "未完成");
        (w.essays || []).forEach(function (e) {
          html += '<div class="review-row"><span>' + (e.type === "email" ? "Email" : "Discussion") +
            " · " + (e.words || 0) + " 词</span></div><p class=\"sample\">" +
            String(e.ua || "（未作答）").replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</p>";
        });
        html += row("Speaking", s.total != null
          ? ("已录 " + (s.recorded || 0) + " / " + s.total + " · 不自动估分")
          : "未完成");
        document.getElementById("summary").innerHTML = html;
        show(document.getElementById("done"));
        return;
      }

      var wrap = document.getElementById("start-wrap");
      if (mode) {
        wrap.innerHTML = '<button class="btn" type="button" id="start-btn">开始' +
          (mode === "mock" ? "模考" : "练习") + "</button>";
        document.getElementById("start-btn").onclick = function () { start(mode); };
      } else {
        wrap.innerHTML =
          '<button class="btn" type="button" id="start-practice">开始练习</button> ' +
          '<button class="btn" type="button" id="start-mock">开始模考</button>';
        document.getElementById("start-practice").onclick = function () { start("practice"); };
        document.getElementById("start-mock").onclick = function () { start("mock"); };
      }
      show(document.getElementById("intro"));
    })();
  </script>
</body>
</html>
