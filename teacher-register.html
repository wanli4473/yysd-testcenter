<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260722brand"></script>
  <title>管理员注册 · 学习平台</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260722polish">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260722polish">
</head>
<body class="home-minimal teacher-auth-page">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="index.html" class="minimal-brand" aria-label="首页">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>学习平台</b>
          <span>Teacher Portal</span>
        </span>
      </a>
      <nav class="minimal-nav" aria-label="教师导航">
        <a href="index.html">返回学生端</a>
        <a href="teacher-login.html" id="nav-login-link">教师登录</a>
      </nav>
    </div>
  </header>

  <main class="minimal-shell minimal-main auth-main">
    <div class="auth-layout">
      <aside class="auth-aside reveal" aria-label="介绍">
        <div class="auth-aside__logo" aria-hidden="true">
          <img src="assets/img/logo.svg?v=20260702-logo" alt="">
        </div>
        <span class="auth-aside__eyebrow" id="aside-eyebrow">教师注册</span>
        <h2 class="auth-aside__title" id="aside-title">注册教师账号<br>管理教学事务</h2>
        <p class="auth-aside__desc" id="aside-desc">使用机构提供的教师注册密钥完成注册。登录后可查看学生成绩、布置练习。</p>
        <ul class="auth-aside__points" id="aside-points">
          <li>机构密钥注册</li>
          <li>学生成绩汇总</li>
          <li>布置练习任务</li>
        </ul>
      </aside>
      <section class="auth-card reveal">
        <div class="auth-tabs">
          <a class="auth-tabs__item" href="teacher-login.html" id="tab-login-link">登录</a>
          <span class="auth-tabs__item is-active">注册</span>
        </div>
        <h1 class="auth-card__title" id="card-title">教师注册</h1>
        <p class="auth-card__desc" id="card-desc">请向机构管理员获取教师注册密钥。</p>

        <form class="auth-form" id="register-form" novalidate>
          <label class="auth-field" id="role-field" hidden>
            <span>注册身份</span>
            <select id="reg-role">
              <option value="teacher">老师</option>
              <option value="org_admin">本校管理员</option>
            </select>
          </label>
          <label class="auth-field">
            <span>姓名（可选）</span>
            <input type="text" id="name" autocomplete="name" maxlength="40" placeholder="便于识别，如：王老师">
          </label>
          <label class="auth-field">
            <span>手机号</span>
            <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="11 位中国大陆手机号" required>
          </label>
          <label class="auth-field" id="key-field">
            <span id="key-label">教师注册密钥</span>
            <input type="password" id="teacher-key" autocomplete="off" placeholder="机构提供的专属密钥">
          </label>
          <label class="auth-field">
            <span>设置密码</span>
            <input type="password" id="password" autocomplete="new-password" minlength="6" maxlength="64" placeholder="至少 6 位" required>
          </label>
          <label class="auth-field">
            <span>确认密码</span>
            <input type="password" id="confirm" autocomplete="new-password" minlength="6" maxlength="64" placeholder="再次输入密码" required>
          </label>
          <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn--primary btn--block pressable" id="submit-btn">注册并进入教师端</button>
        </form>

        <p class="auth-legal">
          已有账号？<a href="teacher-login.html" id="foot-login-link">去登录</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> <span data-icp></span></p>
    </div>
  </footer>

  <script src="assets/js/auth.js?v=20260806report"></script>
  <script src="assets/js/teacher-auth.js?v=20260806report"></script>
  <script src="assets/js/ui.js?v=20260702f"></script>
  <script>
  (function () {
    var T = window.YYSD_TEACHER;
    var A = window.YYSD_AUTH;
    var form = document.getElementById("register-form");
    var msgEl = document.getElementById("msg");
    var inviteToken = new URLSearchParams(location.search).get("invite") || "";
    var tenantMode = A.isHqSite && !A.isHqSite();

    if (T.getToken()) {
      location.replace("teacher.html");
      return;
    }

    document.getElementById("year").textContent = new Date().getFullYear();

    function showMsg(text, ok) {
      msgEl.textContent = text || "";
      msgEl.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    function setupInvite(d) {
      var org = d.org || {};
      var name = org.name || "本校";
      document.getElementById("card-title").textContent = "管理员注册";
      document.getElementById("card-desc").textContent =
        "您正在注册「" + name + "」的管理员账号。设置密码后即可管理本校师生。";
      document.getElementById("aside-title").innerHTML = "成为" + name + "<br>管理员";
      document.getElementById("aside-desc").textContent = "无需教师密钥。完成注册后请妥善保管密码。";
      document.getElementById("aside-eyebrow").textContent = name;
      document.getElementById("submit-btn").textContent = "完成注册并进入";
      document.getElementById("key-field").hidden = true;
      document.getElementById("teacher-key").required = false;
      if (d.invite && d.invite.phoneFull) {
        var phoneEl = document.getElementById("phone");
        phoneEl.value = d.invite.phoneFull;
        phoneEl.readOnly = true;
      }
      if (A && A.applyOrgBrand) A.applyOrgBrand(org);
    }

    var tenantLoginUrl = "login.html?next=" + encodeURIComponent("teacher.html");

    if (tenantMode) {
      inviteToken = "";
      ["nav-login-link", "tab-login-link", "foot-login-link"].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.href = tenantLoginUrl;
      });
      document.getElementById("role-field").hidden = false;
      document.getElementById("teacher-key").required = true;
      document.getElementById("card-title").textContent = "工作人员注册";
      document.getElementById("card-desc").textContent =
        "向学校索取注册密钥，选择身份后完成注册。";
      document.getElementById("aside-eyebrow").textContent = "工作人员";
      document.getElementById("aside-title").innerHTML = "密钥注册";
      document.getElementById("aside-desc").textContent =
        "老师或管理员使用对应密钥注册；登录统一使用 login 页。";
      document.getElementById("aside-points").innerHTML =
        "<li>注册密钥</li><li>手机号 + 密码登录</li><li>成绩与任务管理</li>";
      document.getElementById("key-label").textContent = "注册密钥";
      document.getElementById("teacher-key").placeholder = "注册密钥";
    } else if (inviteToken && A && A.api) {
      A.api("/api/tenant/invite/" + encodeURIComponent(inviteToken))
        .then(setupInvite)
        .catch(function (e) {
          showMsg(e.message || "邀请无效");
          form.querySelectorAll("input,button").forEach(function (el) { el.disabled = true; });
        });
    } else {
      document.getElementById("teacher-key").required = true;
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      showMsg("");
      var body = {
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        password: document.getElementById("password").value,
        confirm: document.getElementById("confirm").value
      };
      if (inviteToken) body.inviteToken = inviteToken;
      else {
        body.teacherKey = document.getElementById("teacher-key").value;
        if (tenantMode) body.role = document.getElementById("reg-role").value;
      }

      T.api("/api/teacher/register", { method: "POST", body: body })
        .then(function (d) {
          if (d.alreadyRegistered) {
            showMsg(d.message || "请直接登录", true);
            setTimeout(function () {
              location.href = tenantMode ? tenantLoginUrl : "teacher-login.html";
            }, 1200);
            return;
          }
          T.setToken(d.token);
          T.setTeacher(d.teacher || { phone: body.phone });
          try {
            var teacher = d.teacher || {};
            localStorage.setItem("yysd:auth:user", JSON.stringify({
              phone: teacher.phone || body.phone,
              role: "teacher",
              displayName: teacher.name || "",
              avatarUrl: teacher.avatarUrl || "",
              isAdmin: !!teacher.isAdmin,
              isPlatformAdmin: !!teacher.isPlatformAdmin
            }));
            localStorage.setItem("yysd:teacher:user", JSON.stringify({
              phone: teacher.phone || body.phone,
              name: teacher.name || "",
              avatarUrl: teacher.avatarUrl || "",
              isAdmin: !!teacher.isAdmin,
              isPlatformAdmin: !!teacher.isPlatformAdmin
            }));
          } catch (e) {}
          location.href = "teacher.html";
        })
        .catch(function (e) { showMsg(e.message); });
    });
  })();
  </script>
</body>
</html>
