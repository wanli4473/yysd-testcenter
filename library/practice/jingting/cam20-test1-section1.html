<style>
  :root{ --red:#c8102e; --navy:#14213d; --ink:#1f2a3a; --muted:#667085; --line:#e4e8ef;

  .sent-item:hover{ background:#f4f6fb; }
  .sent-item.active{ background:#eef0fb; color:var(--purple); font-weight:600; }
  .sent-item .dot{ width:8px; height:8px; border-radius:50%; background:#cfd6e4; flex:0 0 auto; }
  .sent-item.done .dot{ background:var(--green); }
  .sent-item.active .dot{ background:var(--purple); }

  .row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .btn{ background:var(--red); color:#fff; border:0; border-radius:10px; padding:11px 20px; font-size:15px;
        font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn:hover{ filter:brightness(1.05); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.ghost{ background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:600; }
  .btn.rec{ background:var(--purple); }

  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(163,45,45,.4);} 50%{ box-shadow:0 0 0 8px rgba(163,45,45,0);} }
  .toggle{ font-size:14px; color:var(--purple); cursor:pointer; user-select:none; }
  .speaker{ font-size:12px; font-weight:700; padding:2px 9px; border-radius:12px; background:#eef0fb; color:var(--purple); }

  .stage-tag{ display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px;

               min-height:64px; font-size:17px; text-align:center; color:var(--ink); }
  .transcript.hidden-text{ color:var(--purple); cursor:pointer; font-size:15px; }

          font-size:15px; min-height:46px; }

  .verdict{ margin-top:12px; border-radius:10px; padding:13px 15px; font-size:14.5px; display:none; }
  .verdict.show{ display:block; }
  .verdict.ok{ background:#e9f8f1; border:1px solid #b9e6d2; color:#14633f; }
  .verdict.no{ background:#fdecec; border:1px solid #f3c9c9; color:#9a2828; }

<div class="wrap">

  <div class="card">
    <h1>听力精听 · AI 跟读模式</h1>
    <p class="lead">剑雅20 Test 1 — Section 1 · 盲听跟读 · 逐词反馈（共 75 句）</p>
    <div id="modeBanner" class="mode-banner"></div>
    <div class="progress-bar"><div class="fill" id="progFill"></div></div>
    <div class="progress-text" id="progText">进度 0 / 75</div>
  </div>

    <aside class="list">
      <h3>句子列表</h3>
      <div id="sentList"></div>
    </aside>

    <section id="mainStage">
      <div class="card" id="stageRepeat">
        <span class="stage-tag">跟读测试 · 盲听复述</span>
        <div class="row" style="margin-bottom:12px;">
          <span class="speaker" id="speakerTag">—</span>
          <button class="btn" id="playBtn">▶ 播放例句</button>
        </div>
        <div class="blind-panel" id="transcript">🔒 测试期间不显示原文 · 请先听清再复述</div>
        <div class="divider"></div>
        <div class="row">
          <button class="btn rec" id="recBtn">🎙 点击开始复述</button>
          <button class="btn ghost" id="stopBtn" disabled>■ 说完点停止</button>
        </div>
        <div class="heard" id="heard"><span class="ph">你复述的内容会显示在这里…</span></div>
        <div class="verdict" id="verdict"></div>
        <p class="sr-note" id="srNote"></p>
      </div>

      <div class="card" id="stageTranslate" style="display:none !important;" hidden>
        <span class="stage-tag" style="background:#e1f5ee;color:#0f6e56;">第 2 步 · 翻译这句话</span>

          <button class="btn" id="checkZhBtn">提交翻译</button>
          <button class="btn ghost" id="nextBtn" style="display:none;">下一句 →</button>
        </div>
        <div class="verdict" id="zhVerdict"></div>
      </div>

      <div class="card finish-card" id="stageFinish" style="display:none;">
        <h2>🎉 Section 1 精听完成！</h2>
        <p id="finishSummary">你已完成全部句子。</p>
        <button class="btn" id="restartBtn">从头再练一遍</button>
      </div>
    </section>
  </div>
</div>

<script>

var cur = 0, done = [];
var PASS_THRESH = 0.85;
var PASS_THRESH_SHORT = 0.9;

function countDone(){ return done.filter(Boolean).length; }
function updateProgress(){
  var n = countDone(), total = SENTENCES.length;
  document.getElementById('progFill').style.width = (n / total * 100) + '%';
  document.getElementById('progText').textContent = '进度 ' + n + ' / ' + total;
}

var sentList = document.getElementById('sentList');
function renderList(){
  sentList.innerHTML = SENTENCES.map(function(s, i){
    return '<div class="sent-item '+(i===cur?'active':'')+(done[i]?' done':'')+'" data-i="'+i+'">'
         + '<span class="dot"></span>第 '+(i+1)+' 句</div>';
  }).join('');
  Array.prototype.forEach.call(sentList.querySelectorAll('.sent-item'), function(el){
    el.onclick = function(){ goTo(+el.dataset.i); };
  });
  updateProgress();
}

function goTo(i){
  cur = i;
  document.getElementById('stageFinish').style.display = 'none';
  document.getElementById('stageRepeat').style.display = '';
  resetStage();
  renderList();
  var active = sentList.querySelector('.sent-item.active');
  if(active) active.scrollIntoView({block:'nearest', behavior:'smooth'});
}

var transcript = document.getElementById('transcript');
function paintTranscript(){
  var s = SENTENCES[cur];
  document.getElementById('speakerTag').textContent = s.who === 'W' ? 'WOMAN' : 'MAN';
  transcript.textContent = '🔒 测试期间不显示原文 · 请先听清再复述';
}

document.getElementById('playBtn').onclick = function(){
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(SENTENCES[cur].en);
    u.lang = 'en-GB'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){ alert('当前浏览器不支持朗读，请换 Chrome。'); }
};

var heard = document.getElementById('heard'), verdict = document.getElementById('verdict');
var srNote = document.getElementById('srNote'), recBtn = document.getElementById('recBtn');
var stopBtn = document.getElementById('stopBtn');
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var recog = null, lastHeard = '', wantRec = false;

if(!SR){
  srNote.textContent = '⚠️ 请用电脑版 Chrome 打开以使用语音识别。';
  recBtn.disabled = true;
}

function setRecUi(on){
  if(on){
    recBtn.classList.add('on'); recBtn.disabled = true; stopBtn.disabled = false;
  } else {
    recBtn.classList.remove('on'); recBtn.disabled = false; stopBtn.disabled = true;
  }
}

function startRec(){
  if(!SR || wantRec) return;
  window.speechSynthesis.cancel();
  lastHeard = '';
  wantRec = true;
  heard.innerHTML = '<span class="ph">🎙 正在听… 说完整句后点「说完点停止」</span>';
  verdict.classList.remove('show');
  srNote.textContent = '';
  recog = new SR();
  recog.lang = 'en-GB';
  recog.continuous = true;
  recog.interimResults = true;
  recog.maxAlternatives = 1;
  recog.onresult = function(ev){
    var txt = '';
    for(var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    lastHeard = txt.trim();
    heard.textContent = lastHeard || '…';
  };
  recog.onerror = function(ev){
    if(ev.error === 'no-speech' || ev.error === 'aborted') return;
    wantRec = false;
    setRecUi(false);
    var msg = { 'not-allowed': '请允许麦克风权限（地址栏左侧锁图标）', 'network': '网络错误', 'service-not-allowed': '请用 Chrome 直接打开本页，或从考场页重新进入' };
    srNote.textContent = '识别出错：' + (msg[ev.error] || ev.error);
  };
  recog.onend = function(){
    if(wantRec){
      try { recog.start(); } catch(e) {}
      return;
    }
    setRecUi(false);
  };
  try {
    recog.start();
    setRecUi(true);
  } catch(e) {
    wantRec = false;
    setRecUi(false);
    srNote.textContent = '无法启动麦克风，请检查权限并用 Chrome 打开。';
  }
}
recBtn.onclick = startRec;
stopBtn.onclick = function(){
  if(!wantRec) return;
  wantRec = false;
  if(recog) try { recog.stop(); } catch(e) {}
  setRecUi(false);
  if(lastHeard) shadowCheck(lastHeard);
  else {
    heard.innerHTML = '<span class="ph">未识别到语音，请再试一次</span>';
    srNote.textContent = '提示：等播放完再复述，说完后再点停止。';
  }
};

function shadowCheck(text){
  verdict.className = 'verdict show';
  verdict.innerHTML = '⏳ 正在逐词分析跟读…';
  var s = SENTENCES[cur];
  if(API_BASE){
    fetch(API_BASE + '/api/jingting/shadow', {
      method:'POST',
      headers:(function(){
        var h={'Content-Type':'application/json'};
        try{
          var t=localStorage.getItem('yysd:auth:token')||localStorage.getItem('yysd:teacher:token')||'';
          if(t) h.Authorization='Bearer '+t;
        }catch(e){}
        return h;
      })(),
      body: JSON.stringify({ heard:text, target:s.en })
    }).then(function(r){ return r.json().then(function(d){ d._status=r.status; return d; }); })
      .then(function(d){
        if(d._status===401 || d.error){
          verdict.className='verdict show no';
          verdict.innerHTML='<b>❌</b> '+(d._status===401?'请先登录后再使用 AI 跟读':d.error);
          return;
        }
        showShadowResult(d, text);
      })
      .catch(function(){
        showShadowResult(localShadow(s.en, text), text);
      });
  } else { showShadowResult(localShadow(s.en, text), text); }
}

function tokenize(s){
  return String(s).toLowerCase().replace(/[^a-z0-9'\s-]/gi,' ').split(/\s+/).filter(Boolean);
}

function localShadow(target, heard){
  var tgt = tokenize(target), h = tokenize(heard);
  var hi = 0, words = [], ok = 0;
  tgt.forEach(function(t){
    var idx = -1;
    for(var j = hi; j < h.length; j++){ if(h[j] === t){ idx = j; break; } }
    if(idx >= 0){
      words.push({ target: t, heard: h[idx], status: 'correct' });
      ok++; hi = idx + 1;
    } else {
      words.push({ target: t, heard: '', status: 'missing' });
    }
  });
  var extras = h.slice(hi);
  var acc = tgt.length ? ok / tgt.length : 0;
  var thresh = tgt.length <= 5 ? PASS_THRESH_SHORT : PASS_THRESH;
  return { words: words, extras: extras, accuracy: acc, pass: acc >= thresh,
    comment: '本地简易对比。连接 AI 服务器可获得更准确的逐词分析。' };
}

function buildWordDiff(d, heardRaw){
  var words = d.words || [];
  var acc = Math.round((d.accuracy || 0) * 100);
  var row = words.map(function(w){
    var cls = w.status === 'correct' ? 'w-ok' : (w.status === 'missing' ? 'w-miss' : 'w-bad');
    var tip = '';
    if(w.status === 'wrong' && w.heard) tip = ' title="你说成了：'+w.heard+'"';
    if(w.status === 'missing') tip = ' title="漏读"';
    return '<span class="w-tok '+cls+'"'+tip+'>'+escHtml(w.target)+'</span>';
  }).join('');
  var extras = (d.extras || []).map(function(e){
    return '<span class="w-tok w-extra" title="多余的词">'+escHtml(e)+'</span>';
  }).join('');
  return '<div class="word-diff"><div class="word-diff-hd">📊 跟读逐词对照 · 准确率 '+acc+'%</div>'+
    '<div class="word-row">'+row+(extras ? ' '+extras : '')+'</div>'+
    '<div class="word-legend"><span class="w-ok">绿色=正确</span><span class="w-bad">红色=错误</span><span class="w-miss">灰色=漏读</span></div>'+
    '<div class="heard-echo"><b>你说的：</b>'+escHtml(heardRaw)+'</div></div>';
}

function postActionButtons(passed){
  if(passed){
    return '<div class="post-actions">'+
      (cur < SENTENCES.length - 1
        ? '<button class="btn" id="nextSentBtn">下一句 →</button>'
        : '<button class="btn" id="finishBtn">完成本节 →</button>')+
      '</div>';
  }
  return '<div class="post-actions"><button class="btn" id="retryBtn">🔄 再听一遍，重试</button></div>';
}

function showShadowResult(d, heardRaw){
  var pass = !!d.pass;
  verdict.className = 'verdict show ' + (pass ? 'ok' : 'no');
  verdict.innerHTML = '<b>'+(pass?'✅ 过关！':'❌ 未达标，请重试')+'</b> '+(d.comment||'')+
    buildWordDiff(d, heardRaw) + postActionButtons(pass);
  var retry = document.getElementById('retryBtn');
  if(retry) retry.onclick = function(){ resetAttempt(); };
  var next = document.getElementById('nextSentBtn');
  if(next) next.onclick = function(){ done[cur]=true; renderList(); goTo(cur+1); };
  var fin = document.getElementById('finishBtn');
  if(fin) fin.onclick = function(){ done[cur]=true; renderList(); showFinish(); };
  if(pass){ done[cur]=true; renderList(); }
}

function resetAttempt(){
  heard.innerHTML = '<span class="ph">你复述的内容会显示在这里…</span>';
  verdict.classList.remove('show');
  srNote.textContent = '';
  lastHeard = '';
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showFinish(){
  document.getElementById('stageRepeat').style.display = 'none';
  document.getElementById('stageFinish').style.display = '';
  var n = countDone();
  document.getElementById('finishSummary').textContent =
    '你完成了 ' + n + ' / ' + SENTENCES.length + ' 句跟读过关。';
  try{
    window.parent.postMessage({ type:'yysd:score', score:n, total:SENTENCES.length }, '*');
  }catch(e){}
  document.getElementById('stageFinish').scrollIntoView({behavior:'smooth'});
}

document.getElementById('restartBtn').onclick = function(){
  cur = 0; done = [];
  document.getElementById('stageFinish').style.display = 'none';
  document.getElementById('stageRepeat').style.display = '';
  resetStage(); renderList();
};

function resetStage(){
  wantRec = false;
  if(recog) try { recog.stop(); } catch(e) {}
  setRecUi(false);
  paintTranscript();
  heard.innerHTML = '<span class="ph">你复述的内容会显示在这里…</span>';
  verdict.classList.remove('show');
  srNote.textContent = '';
  lastHeard = '';
}

document.getElementById('modeBanner').textContent = API_BASE
  ? '正在连接 AI 服务…'
  : '跟读模式 · 本地体验：请连接 AI 服务器获得逐词智能分析。';

function setAiBanner(cls, text){
  var b = document.getElementById('modeBanner');
  b.className = 'mode-banner' + (cls ? ' ' + cls : '');
  b.textContent = text;
}

if(API_BASE){
  fetch(API_BASE + '/api/health').then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok && d.ai){
        setAiBanner('ok', '跟读模式 · AI 已连接 · 盲听复述，逐词标绿/红/灰，准确率≥85%过关（短句≥90%）。');
      } else {
        setAiBanner('err', '跟读模式 · AI 服务异常，请刷新页面重试');
      }
    })
    .catch(function(){
      setAiBanner('err', '跟读模式 · AI 连接失败，请检查网络后刷新');
    });
}

renderList(); resetStage();
</script>
