    <style>

        .nav-tab { padding:9px 20px; border-radius:26px; border:none; cursor:pointer; font-size:0.9rem; font-weight:600; transition:var(--transition); background:transparent; color:var(--text-light); font-family:var(--font-body); }
        .nav-tab.active { background:#fff; color:var(--primary); box-shadow:0 1px 4px rgba(0,0,0,0.08); }
        .nav-tab:hover:not(.active) { color:var(--primary); background:rgba(255,255,255,0.5); }
        .word-count-badge { font-size:0.8rem; color:var(--text-muted); background:var(--tag-bg); padding:5px 12px; border-radius:20px; font-weight:500; }
        .main-container { max-width:1200px; margin:0 auto; padding:24px 20px 40px; }
        .learn-section, .test-section { display:none; }
        .learn-section.active, .test-section.active { display:block; }
        .learn-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
        .word-card { background:var(--card-bg); border-radius:var(--radius); padding:16px 18px; cursor:pointer; transition:var(--transition); border:1.5px solid transparent; box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:6px; user-select:none; }
        .word-card:hover { box-shadow:var(--shadow-hover); border-color:#d5cec4; transform:translateY(-2px); }
        .word-card.expanded { border-color:var(--primary-light); box-shadow:var(--shadow-hover); grid-column:1/-1; cursor:default; z-index:10; background:#fefefd; }
        .word-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .word-headword { font-family:var(--font-heading); font-size:1.25rem; font-weight:700; color:var(--primary); }
        .word-ipa { font-family:var(--font-ipa); font-size:0.85rem; color:var(--text-muted); }
        .btn-play { width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; background:#f0ede6; color:var(--primary); font-size:0.85rem; transition:var(--transition); display:flex; align-items:center; justify-content:center; }
        .btn-play:hover { background:var(--primary); color:#fff; }
        .btn-play.playing { background:var(--accent); color:#fff; animation:pulse-play 0.8s infinite; }
        @keyframes pulse-play { 0%,100%{ box-shadow:0 0 0 0 rgba(200,150,62,0.5); } 50%{ box-shadow:0 0 0 14px rgba(200,150,62,0); } }
        .word-pos { display:inline-block; font-size:0.75rem; font-weight:600; color:var(--accent); background:#fdf8f0; padding:3px 8px; border-radius:4px; }
        .word-meaning { font-size:0.9rem; color:var(--text); font-weight:500; }
        .word-detail { display:none; margin-top:8px; padding-top:10px; border-top:1px dashed var(--border); animation:fadeIn 0.25s ease; }
        .word-card.expanded .word-detail { display:block; }
        @keyframes fadeIn { from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
        .word-detail-row { font-size:0.85rem; margin-bottom:6px; color:var(--text-light); line-height:1.5; }

        .word-detail-example { background:#fafaf7; padding:8px 12px; border-radius:var(--radius-xs); color:#555; border-left:3px solid var(--accent-light); margin-top:4px; font-size:0.85rem; }
        .card-collapse-hint { font-size:0.7rem; color:var(--text-muted); text-align:center; margin-top:4px; display:none; }
        .word-card.expanded .card-collapse-hint { display:block; }
        .test-setup { background:var(--card-bg); border-radius:var(--radius); padding:28px 24px; text-align:center; box-shadow:var(--shadow); max-width:520px; margin:0 auto; }
        .test-setup h3 { font-family:var(--font-heading); font-size:1.3rem; color:var(--primary); margin-bottom:8px; }
        .test-setup p { color:var(--text-light); margin-bottom:20px; font-size:0.9rem; }
        .btn-start-test { padding:12px 36px; border-radius:26px; border:none; cursor:pointer; font-size:1rem; font-weight:700; background:var(--primary); color:#fff; transition:var(--transition); font-family:var(--font-body); }
        .btn-start-test:hover { background:var(--primary-light); box-shadow:0 4px 16px rgba(44,62,107,0.3); transform:translateY(-1px); }
        .test-active-area, .test-results { display:none; max-width:600px; margin:0 auto; background:var(--card-bg); border-radius:var(--radius); padding:28px 24px; box-shadow:var(--shadow); text-align:center; }
        .test-active-area.visible, .test-results.visible { display:block; }
        .test-progress { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; font-size:0.85rem; color:var(--text-muted); font-weight:500; }
        .progress-bar-wrap { flex:1; height:6px; background:#e8e4dc; border-radius:3px; margin:0 12px; overflow:hidden; }
        .progress-bar-fill { height:100%; background:var(--primary); border-radius:3px; transition:width 0.35s ease; }
        .test-play-area { margin:20px 0; }
        .btn-play-large { width:70px; height:70px; border-radius:50%; border:none; cursor:pointer; background:var(--primary); color:#fff; font-size:1.6rem; transition:var(--transition); box-shadow:0 4px 16px rgba(44,62,107,0.25); }
        .btn-play-large:hover { background:var(--primary-light); transform:scale(1.05); }
        .btn-play-large.playing { background:var(--accent); animation:pulse-play-large 0.8s infinite; }
        @keyframes pulse-play-large { 0%,100%{ box-shadow:0 0 0 0 rgba(200,150,62,0.6); } 50%{ box-shadow:0 0 0 22px rgba(200,150,62,0); } }
        .test-inputs { display:flex; flex-direction:column; gap:12px; margin:20px 0; text-align:left; }
        .test-input-group label { display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px; }
        .test-input-group input { width:100%; padding:12px 14px; border-radius:var(--radius-sm); border:2px solid var(--border); font-size:1rem; transition:var(--transition); background:#fafaf8; }
        .test-input-group input:focus { outline:none; border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(61,90,153,0.08); }
        .correct-input { border-color:var(--success)!important; background:var(--success-bg)!important; }
        .wrong-input { border-color:var(--error)!important; background:var(--error-bg)!important; }
        .btn-submit { padding:12px 32px; border-radius:26px; border:none; cursor:pointer; font-size:1rem; font-weight:700; background:var(--primary); color:#fff; }
        .btn-submit:disabled { opacity:0.5; cursor:not-allowed; }
        .test-feedback { margin-top:16px; padding:14px 16px; border-radius:var(--radius-sm); font-size:0.9rem; display:none; animation:fadeIn 0.3s ease; text-align:left; line-height:1.7; }
        .test-feedback.visible { display:block; }
        .test-feedback.correct-all { background:var(--success-bg); border:1px solid #c3e0cd; color:#2d5a3d; }
        .test-feedback.partial { background:var(--warning-bg); border:1px solid #f0d78c; color:#6b4f1a; }

        .btn-next { margin-top:12px; padding:10px 24px; border-radius:22px; border:2px solid var(--primary); cursor:pointer; font-size:0.9rem; font-weight:600; background:#fff; color:var(--primary); display:none; }

        .btn-next:hover { background:var(--primary); color:#fff; }
        .results-score { font-family:var(--font-heading); font-size:3.5rem; font-weight:700; color:var(--primary); }
        .results-detail { font-size:0.9rem; color:var(--text-light); margin:8px 0 20px; }
        .results-table { width:100%; border-collapse:collapse; margin:16px 0; font-size:0.85rem; text-align:left; }
        .results-table th, .results-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
        .results-table th { background:#fafaf7; color:var(--primary); }
        .row-correct { background:#f9fdf9; } .row-wrong { background:#fefbfb; }
        .btn-retry { margin-top:16px; padding:12px 28px; border-radius:26px; border:none; cursor:pointer; font-weight:700; background:var(--accent); color:#fff; }
        .btn-back-setup { margin-left:10px; background:#fff; color:var(--primary); border:2px solid var(--primary); }

        .history-list li { padding:10px 12px; background:#fff; border-radius:var(--radius-sm); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; border:1px solid var(--border); }

        .history-empty { color:var(--text-muted); text-align:center; padding:16px; font-size:0.85rem; }

        @media (max-width:768px) {

            .word-card { padding:12px 14px; }
            .word-headword { font-size:1.1rem; }
            .word-count-badge { display:none; }
            .btn-play-large { width:56px; height:56px; font-size:1.3rem; }
            .results-score { font-size:2.5rem; }
        }

印象","观感"],"collocations":[{"phrase":"make an impression","meaning":"留下印象"},{"phrase":"first impression","meaning":"第一印象"}],"root":"im-(入) + press(压) → 压入心里","synonyms":["feeling"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"印象","topic":"社交"},"exampleEn":"His speech left a deep impression on us.","exampleZh":"他的演讲给我们留下深刻印象。"},{"id":21,"word":"annoy","ipa":"/əˈnɔɪ/","pos":"v.","meaning":"v. 使恼怒，打扰。be annoyed at / with。形容词 annoying / annoyed。名词 annoyance。","phrases":"be annoyed with（对某人生气）, annoying（恼人的）","example":"The loud music annoyed the neighbours.（嘈杂的音乐惹恼了邻居。）","acceptCN":["使恼怒","打扰"],"collocations":[{"phrase":"be annoyed with","meaning":"对某人生气"},{"phrase":"annoying","meaning":"恼人的"}],"root":"annoyed 人恼火；annoying 事物恼人","synonyms":["irritate","bother"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"使恼怒","topic":"情感"},"exampleEn":"The loud music annoyed the neighbours.","exampleZh":"嘈杂的音乐惹恼了邻居。"},{"id":22,"word":"mind","ipa":"/maɪnd/","pos":"n. / v.","meaning":"n. 头脑，心思。v. 介意；照看。Would you mind doing…? never mind；make up one's mind；keep in mind。","phrases":"would you mind（你是否介意）, make up one's mind（下决心）, never mind（没关系）","example":"Would you mind opening the window?（你介意开一下窗吗？）","acceptCN":["头脑","介意","照看"],"collocations":[{"phrase":"would you mind","meaning":"你是否介意"},{"phrase":"make up one's mind","meaning":"下决心"},{"phrase":"never mind","meaning":"没关系"}],"root":"mind doing 介意做；Never mind 没关系","synonyms":["brain","care"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"介意","topic":"日常"},"exampleEn":"Would you mind opening the window?","exampleZh":"你介意开一下窗吗？"},{"id":23,"word":"hatch","ipa":"/hætʃ/","pos":"v. / n.","meaning":"v. 孵化；策划（hatch a plan）。n. 舱口。hatch out。Don't count your chickens before they hatch.","phrases":"hatch out（孵出）, hatch a plan（策划计划）","example":"The eggs will hatch in two weeks.（这些蛋两周后会孵化。）","acceptCN":["孵化","策划","舱口"],"collocations":[{"phrase":"hatch out","meaning":"孵出"},{"phrase":"hatch a plan","meaning":"策划计划"}],"root":"谚语：别过早打如意算盘","synonyms":["incubate"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"孵化","topic":"自然"},"exampleEn":"The eggs will hatch in two weeks.","exampleZh":"这些蛋两周后会孵化。"},{"id":24,"word":"die","ipa":"/daɪ/","pos":"v.","meaning":"v. 死。die of / from；die out（灭绝）；be dying to（极想）。形容词 dead；名词 death。进行时表临终或极想。","phrases":"die of（死于疾病等）, die out（灭绝）, be dying to（极想）","example":"Many animals may die out if we don't protect them.（若不保护，许多动物可能灭绝。）","acceptCN":["死","死亡"],"collocations":[{"phrase":"die of","meaning":"死于疾病等"},{"phrase":"die out","meaning":"灭绝"},{"phrase":"be dying to","meaning":"极想"}],"root":"die 短暂动词，一般不与 for+时间连用（改用 be dead）","synonyms":["pass away"],"antonyms":["live"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"死","topic":"通用"},"exampleEn":"Many animals may die out if we don't protect them.","exampleZh":"若不保护，许多动物可能灭绝。"},{"id":25,"word":"fact","ipa":"/fækt/","pos":"n.","meaning":"n. 事实。as a matter of fact；in fact；the fact that。形容词 factual。","phrases":"in fact（事实上）, as a matter of fact（实际上）, the fact that（…的事实）","example":"In fact, the story is based on a true event.（事实上，这个故事基于真实事件。）","acceptCN":["事实","实情"],"collocations":[{"phrase":"in fact","meaning":"事实上"},{"phrase":"as a matter of fact","meaning":"实际上"},{"phrase":"the fact that","meaning":"…的事实"}],"root":"高考：the fact that 引导同位语从句","synonyms":["truth"],"antonyms":["fiction"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"事实","topic":"说明"},"exampleEn":"In fact, the story is based on a true event.","exampleZh":"事实上，这个故事基于真实事件。"},{"id":26,"word":"abstract","ipa":"/ˈæbstrækt/ (adj./n.) · /əbˈstrækt/ (v.)","pos":"adj. / n. / v.","meaning":"adj. 抽象的。n. 摘要。v. 提取。abstract art / idea。反义 concrete。","phrases":"abstract art（抽象艺术）, abstract idea（抽象概念）","example":"Freedom is an abstract idea.（自由是一个抽象概念。）","acceptCN":["抽象的","摘要"],"collocations":[{"phrase":"abstract art","meaning":"抽象艺术"},{"phrase":"abstract idea","meaning":"抽象概念"}],"root":"abs-(离开) + tract(拉) → 抽离出来的","synonyms":["theoretical"],"antonyms":["concrete"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"抽象的","topic":"学术"},"exampleEn":"Freedom is an abstract idea.","exampleZh":"自由是一个抽象概念。"},{"id":27,"word":"declare","ipa":"/dɪˈkleə/ · /dɪˈkler/","pos":"v.","meaning":"v. 宣布，声明；申报。declare war；declare that。名词 declaration。比 announce 更正式、官方。","phrases":"declare war（宣战）, declare that（宣布…）","example":"The government declared a national holiday.（政府宣布了一个全国性假期。）","acceptCN":["宣布","声明","申报"],"collocations":[{"phrase":"declare war","meaning":"宣战"},{"phrase":"declare that","meaning":"宣布…"}],"root":"de-(完全) + clare(清楚) → 说清楚","synonyms":["announce","state"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"宣布","topic":"社会"},"exampleEn":"The government declared a national holiday.","exampleZh":"政府宣布了一个全国性假期。"},{"id":28,"word":"warn","ipa":"/wɔːn/ · /wɔːrn/","pos":"v.","meaning":"v. 警告，提醒。warn sb of / about / to do / that。名词 warning。","phrases":"warn sb of（警告某人注意）, warning（警告）","example":"The teacher warned us not to be late again.（老师警告我们别再迟到。）","acceptCN":["警告","提醒"],"collocations":[{"phrase":"warn sb of","meaning":"警告某人注意"},{"phrase":"warning","meaning":"警告"}],"root":"warn sb (not) to do / that / of","synonyms":["caution","alert"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"警告","topic":"日常"},"exampleEn":"The teacher warned us not to be late again.","exampleZh":"老师警告我们别再迟到。"},{"id":29,"word":"obey","ipa":"/əˈbeɪ/","pos":"v.","meaning":"v. 服从，遵守。obey the rules / the law。名词 obedience；形容词 obedient。反义 disobey。","phrases":"obey the rules（遵守规则）, obedient（顺从的）","example":"Drivers must obey traffic rules.（司机必须遵守交通规则。）","acceptCN":["服从","遵守"],"collocations":[{"phrase":"obey the rules","meaning":"遵守规则"},{"phrase":"obedient","meaning":"顺从的"}],"root":"ob-(向) + ey(听) → 听从","synonyms":["follow"],"antonyms":["disobey"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"遵守","topic":"规则"},"exampleEn":"Drivers must obey traffic rules.","exampleZh":"司机必须遵守交通规则。"},{"id":30,"word":"grade","ipa":"/ɡreɪd/","pos":"n. / v.","meaning":"n. 年级；成绩等级；等级。v. 评分。in grade 10；get a good grade。","phrases":"in Grade 10（在十年级）, get a good grade（取得好成绩）","example":"She got a high grade in the English test.（她英语测验得了高分。）","acceptCN":["年级","成绩","等级"],"collocations":[{"phrase":"in Grade 10","meaning":"在十年级"},{"phrase":"get a good grade","meaning":"取得好成绩"}],"root":"美式年级/分数常用 grade","synonyms":["mark","level"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"成绩","topic":"校园"},"exampleEn":"She got a high grade in the English test.","exampleZh":"她英语测验得了高分。"},{"id":31,"word":"fiction","ipa":"/ˈfɪkʃn/","pos":"n.","meaning":"n. 小说，虚构。science fiction；works of fiction。形容词 fictional。反义 non-fiction / fact。","phrases":"science fiction（科幻小说）, fictional（虚构的）","example":"I prefer fiction to history books.（比起历史书，我更喜欢小说。）","acceptCN":["小说","虚构"],"collocations":[{"phrase":"science fiction","meaning":"科幻小说"},{"phrase":"fictional","meaning":"虚构的"}],"root":"fict(塑造) + -ion → 编造出来的","synonyms":["novel","invention"],"antonyms":["fact"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"小说","topic":"文学"},"exampleEn":"I prefer fiction to history books.","exampleZh":"比起历史书，我更喜欢小说。"},{"id":32,"word":"expensive","ipa":"/ɪkˈspensɪv/","pos":"adj.","meaning":"adj. 昂贵的。反义 cheap / inexpensive。名词 expense。","phrases":"too expensive（太贵）, expensive gift（昂贵的礼物）","example":"The restaurant is good but rather expensive.（这家餐馆不错，但比较贵。）","acceptCN":["昂贵的","贵的"],"collocations":[{"phrase":"too expensive","meaning":"太贵"},{"phrase":"expensive gift","meaning":"昂贵的礼物"}],"root":"ex-(出) + pens(支付) → 要花出去很多钱","synonyms":["costly"],"antonyms":["cheap"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"昂贵的","topic":"日常"},"exampleEn":"The restaurant is good but rather expensive.","exampleZh":"这家餐馆不错，但比较贵。"},{"id":33,"word":"announce","ipa":"/əˈnaʊns/","pos":"v.","meaning":"v. 宣布，通告（较公开）。announce that。名词 announcement / announcer。","phrases":"announce that（宣布…）, make an announcement（发布通知）","example":"The head teacher announced the exam dates.（校长宣布了考试日期。）","acceptCN":["宣布","通告"],"collocations":[{"phrase":"announce that","meaning":"宣布…"},{"phrase":"make an announcement","meaning":"发布通知"}],"root":"ad-(向) + nounce(说) → 向大家说","synonyms":["declare","publish"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"宣布","topic":"校园"},"exampleEn":"The head teacher announced the exam dates.","exampleZh":"校长宣布了考试日期。"},{"id":34,"word":"nowhere","ipa":"/ˈnəʊweə/ · /ˈnoʊwer/","pos":"adv. / n.","meaning":"adv. 无处，哪里都不。nowhere to be found；get nowhere（毫无进展）。","phrases":"nowhere to be found（找不到）, get nowhere（毫无进展）","example":"The keys were nowhere to be found.（钥匙哪儿都找不到。）","acceptCN":["无处","哪里都不"],"collocations":[{"phrase":"nowhere to be found","meaning":"找不到"},{"phrase":"get nowhere","meaning":"毫无进展"}],"root":"no + where；否定副词","synonyms":[],"antonyms":["everywhere"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"无处","topic":"语法"},"exampleEn":"The keys were nowhere to be found.","exampleZh":"钥匙哪儿都找不到。"},{"id":35,"word":"persuade","ipa":"/pəˈsweɪd/","pos":"v.","meaning":"v. 说服，劝服。persuade sb to do / that / of。persuade 强调劝成功；advise 只表劝。名词 persuasion。","phrases":"persuade sb to do（说服某人做）, persuasion（说服）","example":"I persuaded my dad to stop smoking.（我说服爸爸戒烟了。）","acceptCN":["说服","劝服"],"collocations":[{"phrase":"persuade sb to do","meaning":"说服某人做"},{"phrase":"persuasion","meaning":"说服"}],"root":"劝成功用 persuade；未必成功用 try to persuade / advise","synonyms":["convince"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"说服","topic":"社交"},"exampleEn":"I persuaded my dad to stop smoking.","exampleZh":"我说服爸爸戒烟了。"},{"id":36,"word":"balcony","ipa":"/ˈbælkəni/","pos":"n.","meaning":"n. 阳台；（剧院）楼座。on the balcony。","phrases":"on the balcony（在阳台上）, balcony view（阳台景色）","example":"They had breakfast on the balcony.（他们在阳台上吃了早餐。）","acceptCN":["阳台","楼座"],"collocations":[{"phrase":"on the balcony","meaning":"在阳台上"},{"phrase":"balcony view","meaning":"阳台景色"}],"root":"建筑物向外伸出的平台","synonyms":[],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"阳台","topic":"生活"},"exampleEn":"They had breakfast on the balcony.","exampleZh":"他们在阳台上吃了早餐。"},{"id":37,"word":"decision","ipa":"/dɪˈsɪʒn/","pos":"n.","meaning":"n. 决定。make a decision；come to a decision。动词 decide；形容词 decisive。","phrases":"make a decision（做决定）, a final decision（最终决定）","example":"She made a decision to study abroad.（她决定出国留学。）","acceptCN":["决定","决策"],"collocations":[{"phrase":"make a decision","meaning":"做决定"},{"phrase":"a final decision","meaning":"最终决定"}],"root":"de-(离开) + cis(切) + -ion","synonyms":["choice","resolution"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"决定","topic":"日常"},"exampleEn":"She made a decision to study abroad.","exampleZh":"她决定出国留学。"},{"id":38,"word":"real","ipa":"/ˈriːəl/ · /riːl/","pos":"adj.","meaning":"adj. 真的，真实的。real life；the real reason。副词 really；名词 reality。区别 true / genuine。","phrases":"in real life（在现实生活中）, real reason（真正原因）","example":"Is this a real diamond or just glass?（这是真钻石还是玻璃？）","acceptCN":["真的","真实的"],"collocations":[{"phrase":"in real life","meaning":"在现实生活中"},{"phrase":"real reason","meaning":"真正原因"}],"root":"real 真实存在；true 符合事实","synonyms":["true","genuine"],"antonyms":["fake"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"真的","topic":"日常"},"exampleEn":"Is this a real diamond or just glass?","exampleZh":"这是真钻石还是玻璃？"},{"id":39,"word":"seldom","ipa":"/ˈseldəm/","pos":"adv.","meaning":"adv. 很少，不常（否定副词，置于行为动词前、be 后）。Seldom have I…（倒装）。","phrases":"seldom go out（很少出门）, seldom if ever（几乎从不）","example":"He seldom watches TV on weekdays.（他工作日很少看电视。）","acceptCN":["很少","不常"],"collocations":[{"phrase":"seldom go out","meaning":"很少出门"},{"phrase":"seldom if ever","meaning":"几乎从不"}],"root":"否定副词，句首常倒装","synonyms":["rarely"],"antonyms":["often"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"很少","topic":"语法"},"exampleEn":"He seldom watches TV on weekdays.","exampleZh":"他工作日很少看电视。"},{"id":40,"word":"circumstance","ipa":"/ˈsɜːkəmstəns/ · /ˈsɜːrkəmstæns/","pos":"n.","meaning":"n. 情况，境遇（常用复数）。in / under the circumstances；under no circumstances（决不，倒装）。","phrases":"under the circumstances（在这种情况下）, under no circumstances（决不）","example":"Under no circumstances should you give up.（你无论如何都不该放弃。）","acceptCN":["情况","境遇"],"collocations":[{"phrase":"under the circumstances","meaning":"在这种情况下"},{"phrase":"under no circumstances","meaning":"决不"}],"root":"circum-(周围) + stance(站) → 周围状况","synonyms":["situation","condition"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"情况","topic":"说明"},"exampleEn":"Under no circumstances should you give up.","exampleZh":"你无论如何都不该放弃。"},{"id":41,"word":"need","ipa":"/niːd/","pos":"v. / n. / modal v.","meaning":"v. / n. 需要。情态动词 need 多用于否定/疑问：Need I…? / needn't。need to do；need doing = need to be done。","phrases":"need to do（需要做）, in need of（需要）, needn't（不必）","example":"The flowers need watering.（这些花需要浇水。）","acceptCN":["需要","必要"],"collocations":[{"phrase":"need to do","meaning":"需要做"},{"phrase":"in need of","meaning":"需要"},{"phrase":"needn't","meaning":"不必"}],"root":"need doing 主动表被动；情态 need 无第三人称 -s","synonyms":["require"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"需要","topic":"语法"},"exampleEn":"The flowers need watering.","exampleZh":"这些花需要浇水。"},{"id":42,"word":"spot","ipa":"/spɒt/ · /spɑːt/","pos":"n. / v.","meaning":"n. 地点；斑点。v. 发现，认出。on the spot（当场）；a scenic spot；spot a mistake。","phrases":"on the spot（当场）, scenic spot（景点）, spot a mistake（发现错误）","example":"I spotted an error in the first paragraph.（我在第一段发现了一个错误。）","acceptCN":["地点","斑点","发现"],"collocations":[{"phrase":"on the spot","meaning":"当场"},{"phrase":"scenic spot","meaning":"景点"},{"phrase":"spot a mistake","meaning":"发现错误"}],"root":"作动词“发现”为常考义","synonyms":["place","notice"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"地点","topic":"通用"},"exampleEn":"I spotted an error in the first paragraph.","exampleZh":"我在第一段发现了一个错误。"},{"id":43,"word":"bakery","ipa":"/ˈbeɪkəri/","pos":"n.","meaning":"n. 面包店，烘焙坊。at the bakery。动词 bake；名词 baker。","phrases":"at the bakery（在面包店）, bakery products（烘焙食品）","example":"I bought some bread at the bakery.（我在面包店买了些面包。）","acceptCN":["面包店","烘焙坊"],"collocations":[{"phrase":"at the bakery","meaning":"在面包店"},{"phrase":"bakery products","meaning":"烘焙食品"}],"root":"bake + -ery（场所）","synonyms":[],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"面包店","topic":"生活"},"exampleEn":"I bought some bread at the bakery.","exampleZh":"我在面包店买了些面包。"},{"id":44,"word":"anyway","ipa":"/ˈeniweɪ/","pos":"adv.","meaning":"adv. 反正，无论如何；况且。口语中转换话题或坚持原意。也作 anyhow。","phrases":"anyway（反正；不管怎样）","example":"It was raining, but we went hiking anyway.（下着雨，但我们还是去徒步了。）","acceptCN":["反正","无论如何"],"collocations":[{"phrase":"anyway","meaning":"反正；不管怎样"}],"root":"口语衔接词，表让步或收束","synonyms":["anyhow","nevertheless"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"反正","topic":"语法"},"exampleEn":"It was raining, but we went hiking anyway.","exampleZh":"下着雨，但我们还是去徒步了。"},{"id":45,"word":"punish","ipa":"/ˈpʌnɪʃ/","pos":"v.","meaning":"v. 惩罚。punish sb for。名词 punishment。","phrases":"punish sb for（因…惩罚某人）, punishment（惩罚）","example":"The school will punish students who cheat.（学校将处罚作弊学生。）","acceptCN":["惩罚","处罚"],"collocations":[{"phrase":"punish sb for","meaning":"因…惩罚某人"},{"phrase":"punishment","meaning":"惩罚"}],"root":"与 reward 相对","synonyms":["penalize"],"antonyms":["reward"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"惩罚","topic":"规则"},"exampleEn":"The school will punish students who cheat.","exampleZh":"学校将处罚作弊学生。"},{"id":46,"word":"challenge","ipa":"/ˈtʃælɪndʒ/","pos":"n. / v.","meaning":"v. / n. 挑战。face a challenge；challenge sb to do。形容词 challenging。","phrases":"face a challenge（面对挑战）, challenging（有挑战性的）","example":"Learning a new language is a challenge.（学习一门新语言是一种挑战。）","acceptCN":["挑战","考验"],"collocations":[{"phrase":"face a challenge","meaning":"面对挑战"},{"phrase":"challenging","meaning":"有挑战性的"}],"root":"与 List1 challenging 同根","synonyms":["test","dare"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"挑战","topic":"学习"},"exampleEn":"Learning a new language is a challenge.","exampleZh":"学习一门新语言是一种挑战。"},{"id":47,"word":"situation","ipa":"/ˌsɪtʃuˈeɪʃn/","pos":"n.","meaning":"n. 情况，处境，局面。in a difficult situation。动词 situate。","phrases":"in a difficult situation（处于困境）, the current situation（当前形势）","example":"What would you do in this situation?（在这种情况下你会怎么做？）","acceptCN":["情况","处境","局面"],"collocations":[{"phrase":"in a difficult situation","meaning":"处于困境"},{"phrase":"the current situation","meaning":"当前形势"}],"root":"situ(位置) + -ation → 所处位置/状况","synonyms":["circumstance","condition"],"antonyms":[],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"情况","topic":"说明"},"exampleEn":"What would you do in this situation?","exampleZh":"在这种情况下你会怎么做？"},{"id":48,"word":"extraordinary","ipa":"/ɪkˈstrɔːdnri/ · /ɪkˈstrɔːrdəneri/","pos":"adj.","meaning":"adj. 非凡的，特别的。extraordinary talent。反义 ordinary。副词 extraordinarily。","phrases":"extraordinary talent（非凡才能）, extraordinarily（极其）","example":"She has an extraordinary memory.（她有非凡的记忆力。）","acceptCN":["非凡的","特别的"],"collocations":[{"phrase":"extraordinary talent","meaning":"非凡才能"},{"phrase":"extraordinarily","meaning":"极其"}],"root":"extra-(超出) + ordinary","synonyms":["remarkable"],"antonyms":["ordinary"],"examTag":{"source":"高中英语","frequency":4,"commonUsage":"非凡的","topic":"评价"},"exampleEn":"She has an extraordinary memory.","exampleZh":"她有非凡的记忆力。"},{"id":49,"word":"frost","ipa":"/frɒst/ · /frɔːst/","pos":"n. / v.","meaning":"n. 霜，霜冻。v. 结霜。frost on the window；frosty。","phrases":"morning frost（晨霜）, frosty（结霜的；冷淡的）","example":"There was frost on the grass this morning.（今早草上有霜。）","acceptCN":["霜","霜冻"],"collocations":[{"phrase":"morning frost","meaning":"晨霜"},{"phrase // ==================== 语音合成（与 LIST 1/2/3 一致） ====================
let synth = window.speechSynthesis;
let britishFemaleVoice = null;

async function loadVoices() {
    if (!synth) return;
    const getBestVoice = () => {
        const voices = synth.getVoices();
        const preferred = ['Google UK English Female','Microsoft Susan','Microsoft Hazel','Samantha','Fiona'];
        for (const name of preferred) {
            const found = voices.find(v => v.name === name && v.lang.startsWith('en'));
            if (found) return found;
        }
        let voice = voices.find(v => v.lang.startsWith('en-GB') && (v.name.toLowerCase().includes('female')||v.name.toLowerCase().includes('woman')));
        if (voice) return voice;
        voice = voices.find(v => v.lang.startsWith('en-GB')) || voices.find(v => v.lang.startsWith('en-UK')) || voices.find(v => v.lang.startsWith('en'));
        return voice || voices[0];
    };
    if (synth.getVoices().length > 0) {
        britishFemaleVoice = getBestVoice();
    } else {
        await new Promise(resolve => {
            const handler = () => {
                britishFemaleVoice = getBestVoice();
                synth.removeEventListener('voiceschanged', handler);
                resolve();
            };
            synth.addEventListener('voiceschanged', handler);
            setTimeout(() => {
                if (!britishFemaleVoice) britishFemaleVoice = getBestVoice();
                synth.removeEventListener('voiceschanged', handler);
                resolve();
            }, 2000);
        });
    }
    console.log('🔊 选用语音:', britishFemaleVoice?.name);
}

function speakWord(word, callback) {
    if (!synth) { if(callback) callback(); return; }
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(word);
    if (britishFemaleVoice) utterance.voice = britishFemaleVoice;
    utterance.lang = 'en-GB';
    utterance.rate = 0.9;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    if (callback) { utterance.onend = callback; utterance.onerror = () => callback(); }
    synth.speak(utterance);
}

loadVoices();

// ==================== 历史记录 ====================
function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; } }
function saveHistory(record) { const h = getHistory(); h.unshift(record); if(h.length>50) h.length=50; localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }
function clearHistory() { if(confirm('确定要清除所有历史记录吗？')) { localStorage.removeItem(HISTORY_KEY); renderHistory(); } }
function renderHistory() {
    const history = getHistory();
    if(!history.length) { historyContent.innerHTML='<div class="history-empty">暂无检测记录</div>'; return; }
    const list = document.createElement('ul'); list.className='history-list';
    history.forEach(r => {
        const li = document.createElement('li');
        const t = new Date(r.timestamp);
        const ts = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
        li.innerHTML = `<div><span class="history-score">${r.score} / ${r.total}</span><span style="margin-left:8px;color:${r.percent>=80?'#3a7d5a':r.percent>=60?'#b8860b':'#c0392b'};">${r.percent}%</span></div><div class="history-time">${ts}</div>`;
        list.appendChild(li);
    });
    historyContent.innerHTML=''; historyContent.appendChild(list);
}

    currentMode = mode;
    navTabs.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));

    else { learnSection.classList.remove('active'); testSection.classList.add('active'); showTestSetup(); renderHistory(); }
    if(synth) synth.cancel();

});

function buildLearnCards(){
    learnGrid.innerHTML='';
    wordData.forEach(w => {
        const card = document.createElement('div'); card.className='word-card';
        card.innerHTML = `
            <div class="word-card-top"><div><span class="word-headword">${w.word}</span><span class="word-ipa"> ${w.ipa}</span></div><button class="btn-play btn-play-card" data-word="${w.word}">▶</button></div>
            <div><span class="word-pos">${w.pos}</span> <span class="word-meaning">${w.meaning}</span></div>
            <div class="word-detail"><div class="word-detail-row"><strong>📎 常见词组/句型：</strong>${w.phrases}</div><div class="word-detail-example">📖 ${w.example}</div></div>
            <div class="card-collapse-hint">点击卡片收起详情 ▲</div>`;
        card.addEventListener('click', function(e){
            if(e.target.closest('.btn-play-card')) return;
            const wasExpanded = card.classList.contains('expanded');
            document.querySelectorAll('.word-card.expanded').forEach(c=>c.classList.remove('expanded'));
            if(!wasExpanded){ card.classList.add('expanded'); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
        });
        card.querySelector('.btn-play-card').addEventListener('click', function(e){
            e.stopPropagation();
            document.querySelectorAll('.btn-play.playing').forEach(b=>b.classList.remove('playing'));
            this.classList.add('playing');
            speakWord(w.word, ()=>this.classList.remove('playing'));
        });
        learnGrid.appendChild(card);
    });
}
buildLearnCards();
document.addEventListener('click', function(e){

// ==================== 检测模式 ====================
let testWords=[], testCurrentIndex=0, testScore=0, testResultsData=[], testSubmitted=false;
function shuffleArray(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
btnStartTest.addEventListener('click', ()=>{
    testWords = shuffleArray(wordData).slice(0, TOTAL_QUESTIONS);
    testCurrentIndex=0; testScore=0; testResultsData=[]; testSubmitted=false;
    testSetup.style.display='none'; testActiveArea.classList.add('visible'); testResults.classList.remove('visible');
    testFeedback.classList.remove('visible','correct-all','partial','wrong-all'); testFeedback.textContent='';
    btnNext.classList.remove('visible'); btnSubmit.disabled=false; btnSubmit.style.display='';
    inputSpelling.value=''; inputMeaning.value=''; inputSpelling.className=''; inputMeaning.className='';
    btnPlayTest.classList.remove('playing'); updateTestProgress(); setTimeout(()=>playCurrentWord(),400);
});
function updateTestProgress(){
    testProgressLabel.textContent = `第 ${testCurrentIndex+1} / ${TOTAL_QUESTIONS} 题`;
    testScoreLabel.textContent = `得分: ${testScore}`;
    progressBarFill.style.width = Math.round((testCurrentIndex/TOTAL_QUESTIONS)*100)+'%';
}
function playCurrentWord(){ if(testCurrentIndex>=testWords.length) return; btnPlayTest.classList.add('playing'); speakWord(testWords[testCurrentIndex].word, ()=>btnPlayTest.classList.remove('playing')); }
btnPlayTest.addEventListener('click', ()=>{ if(!testSubmitted) playCurrentWord(); });

function submitAnswer(){
    if(testSubmitted || testCurrentIndex>=testWords.length) return;
    testSubmitted=true; btnSubmit.disabled=true;
    const w = testWords[testCurrentIndex];
    const userSpelling = inputSpelling.value.trim();
    const userMeaning = inputMeaning.value.trim();
    const spellingCorrect = userSpelling.toLowerCase() === w.word.toLowerCase();
    let meaningCorrect = false;
    if(userMeaning.length>0){
        const userCN = userMeaning.replace(/\s+/g,'');
        for(const accept of w.acceptCN){ if(userCN.includes(accept)||accept.includes(userCN)){ meaningCorrect=true; break; } }
        if(!meaningCorrect){
            const meaningClean = w.meaning.replace(/[；;，,、\s]/g,'');
            if(userCN.includes(meaningClean.substring(0,Math.min(3,meaningClean.length)))||meaningClean.includes(userCN)) meaningCorrect=true;
        }
    }
    inputSpelling.className = spellingCorrect ? 'correct-input' : 'wrong-input';
    inputMeaning.className = meaningCorrect ? 'correct-input' : 'wrong-input';
    const earned = (spellingCorrect&&meaningCorrect)?1:0;
    if(earned) testScore++;
    testFeedback.classList.add('visible');
    if(spellingCorrect&&meaningCorrect){
        testFeedback.classList.add('correct-all'); testFeedback.classList.remove('partial','wrong-all');
        testFeedback.innerHTML = `✅ <strong>完全正确！</strong><br>${w.word} — ${w.meaning}`;
    } else if(!spellingCorrect && !meaningCorrect){
        testFeedback.classList.add('wrong-all'); testFeedback.classList.remove('correct-all','partial');
        testFeedback.innerHTML = `❌ <strong>拼写和含义均不正确</strong><br>📝 正确拼写：<strong>${w.word}</strong>（你的：${userSpelling||'未填'}）<br>🈶 正确含义：<strong>${w.meaning}</strong>（你的：${userMeaning||'未填'}）`;
    } else if(!spellingCorrect){
        testFeedback.classList.add('partial'); testFeedback.classList.remove('correct-all','wrong-all');
        testFeedback.innerHTML = `⚠️ <strong>含义正确，拼写有误</strong><br>📝 正确拼写：<strong>${w.word}</strong>（你的：${userSpelling||'未填'}）<br>🈶 含义：${w.meaning} ✅`;
    } else {
        testFeedback.classList.add('partial'); testFeedback.classList.remove('correct-all','wrong-all');
        testFeedback.innerHTML = `⚠️ <strong>拼写正确，含义有误</strong><br>📝 ${w.word} ✅<br>🈶 正确含义：<strong>${w.meaning}</strong>（你的：${userMeaning||'未填'}）`;
    }
    testResultsData.push({ word:w.word, ipa:w.ipa, meaning:w.meaning, userSpelling, userMeaning, spellingCorrect, meaningCorrect, earned });
    updateTestProgress();
    btnNext.classList.add('visible'); btnSubmit.style.display='none';
    testFeedback.scrollIntoView({behavior:'smooth',block:'nearest'});
}
btnSubmit.addEventListener('click', submitAnswer);
inputMeaning.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!testSubmitted) submitAnswer(); });
inputSpelling.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!testSubmitted) inputMeaning.focus(); });
btnNext.addEventListener('click', ()=>{

    inputSpelling.value=''; inputMeaning.value=''; inputSpelling.className=''; inputMeaning.className='';
    testFeedback.classList.remove('visible','correct-all','partial','wrong-all'); testFeedback.textContent='';
    btnNext.classList.remove('visible'); btnSubmit.disabled=false; btnSubmit.style.display='';
    updateTestProgress(); setTimeout(()=>playCurrentWord(),300); inputSpelling.focus();
});
function showFinalResults(){
    testActiveArea.classList.remove('visible'); testResults.classList.add('visible');
    const earnedTotal = testResultsData.reduce((s,r)=>s+r.earned,0);
    const percent = Math.round((earnedTotal/TOTAL_QUESTIONS)*100);
    resultsScore.textContent = `${earnedTotal} / ${TOTAL_QUESTIONS}`;
    resultsDetail.textContent = `正确率 ${percent}% — ${percent>=80?'🎉 非常棒！':percent>=60?'👍 不错，继续加油！':'💪 需要更多练习，加油！'}`;
    resultsTableBody.innerHTML='';
    testResultsData.forEach((r,i)=>{
        const tr = document.createElement('tr'); tr.className = r.earned ? 'row-correct' : 'row-wrong';
        const icon = r.earned ? '✅' : (r.spellingCorrect||r.meaningCorrect?'⚠️':'❌');
        tr.innerHTML = `<td>${i+1}</td><td><strong>${r.word}</strong> <span style="color:#888;font-size:0.8rem;">${r.ipa}</span><br><span style="font-size:0.8rem;">${r.meaning}</span></td><td style="color:${r.spellingCorrect?'#3a7d5a':'#c0392b'}">${r.userSpelling||'—'}</td><td style="color:${r.meaningCorrect?'#3a7d5a':'#c0392b'}">${r.userMeaning||'—'}</td><td>${icon}</td>`;
        resultsTableBody.appendChild(tr);
    });
    saveHistory({ timestamp:Date.now(), score:earnedTotal, total:TOTAL_QUESTIONS, percent });
    testResults.scrollIntoView({behavior:'smooth',block:'start'});
}
btnRetry.addEventListener('click', ()=>{
    testResults.classList.remove('visible'); testActiveArea.classList.add('visible');
    testWords = shuffleArray([...wordData]); testCurrentIndex=0; testScore=0; testResultsData=[]; testSubmitted=false;
    inputSpelling.value=''; inputMeaning.value=''; inputSpelling.className=''; inputMeaning.className='';
    testFeedback.classList.remove('visible','correct-all','partial','wrong-all'); testFeedback.textContent='';
    btnNext.classList.remove('visible'); btnSubmit.disabled=false; btnSubmit.style.display='';
    btnPlayTest.classList.remove('playing'); updateTestProgress(); setTimeout(()=>playCurrentWord(),400);
});
btnBackToSetup.addEventListener('click', ()=>{ showTestSetup(); testResults.classList.remove('visible'); renderHistory(); });
btnClearHistory.addEventListener('click', clearHistory);
document.addEventListener('keydown', function(e){
    if(currentMode!=='test'||testResults.classList.contains('visible')) return;
    if(testActiveArea.classList.contains('visible') && !testSubmitted){
        if(e.key===' ' && document.activeElement!==inputSpelling && document.activeElement!==inputMeaning){ e.preventDefault(); playCurrentWord(); }
    }
});
renderHistory();
})();
</script>
</body>
</html>
