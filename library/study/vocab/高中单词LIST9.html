// ==================== 语音合成（与 LIST 1/2/3 一致） ====================
let synth = window.speechSynthesis;
let britishFemaleVoice = null;

async function loadVoices() {
    if (!synth) return;
    const getBestVoice = () => {
        const voices = synth.getVoices();
        const preferred = ['Google UK English Female','Microsoft Susan','Microsoft Hazel','Samantha','Fiona'];
        for (const name of preferred) {
            const found = voices.find(v => v.name === name && v.lang.startsWith('en'));
            if (found) return found;
        }
        let voice = voices.find(v => v.lang.startsWith('en-GB') && (v.name.toLowerCase().includes('female')||v.name.toLowerCase().includes('woman')));
        if (voice) return voice;
        voice = voices.find(v => v.lang.startsWith('en-GB')) || voices.find(v => v.lang.startsWith('en-UK')) || voices.find(v => v.lang.startsWith('en'));
        return voice || voices[0];
    };
    if (synth.getVoices().length > 0) {
        britishFemaleVoice = getBestVoice();
    } else {
        await new Promise(resolve => {
            const handler = () => {
                britishFemaleVoice = getBestVoice();
                synth.removeEventListener('voiceschanged', handler);
                resolve();
            };
            synth.addEventListener('voiceschanged', handler);
            setTimeout(() => {
                if (!britishFemaleVoice) britishFemaleVoice = getBestVoice();
                synth.removeEventListener('voiceschanged', handler);
                resolve();
            }, 2000);
        });
    }
    console.log('🔊 选用语音:', britishFemaleVoice?.name);
}

function speakWord(word, callback) {
    if (!synth) { if(callback) callback(); return; }
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(word);
    if (britishFemaleVoice) utterance.voice = britishFemaleVoice;
    utterance.lang = 'en-GB';
    utterance.rate = 0.9;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    if (callback) { utterance.onend = callback; utterance.onerror = () => callback(); }
    synth.speak(utterance);
}

loadVoices();

// ==================== 历史记录 ====================
function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; } }
function saveHistory(record) { const h = getHistory(); h.unshift(record); if(h.length>50) h.length=50; localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }
function clearHistory() { if(confirm('确定要清除所有历史记录吗？')) { localStorage.removeItem(HISTORY_KEY); renderHistory(); } }
function renderHistory() {
    const history = getHistory();
    if(!history.length) { historyContent.innerHTML='<div class="history-empty">暂无检测记录</div>'; return; }
    const list = document.createElement('ul'); list.className='history-list';
    history.forEach(r => {
        const li = document.createElement('li');
        const t = new Date(r.timestamp);
        const ts = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
        li.innerHTML = `<div><span class="history-score">${r.score} / ${r.total}</span><span style="margin-left:8px;color:${r.percent>=80?'#3a7d5a':r.percent>=60?'#b8860b':'#c0392b'};">${r.percent}%</span></div><div class="history-time">${ts}</div>`;
        list.appendChild(li);
    });
    historyContent.innerHTML=''; historyContent.appendChild(list);
}

// ==================== 导航 ====================
let currentMode = 'learn';
navTabs.addEventListener('click', e => {
    const tab = e.target.closest('.nav-tab'); if(!tab) return;
    const mode = tab.dataset.mode; if(mode===currentMode) return;
    currentMode = mode;
    navTabs.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    if(mode==='learn'){ learnSection.classList.add('active'); testSection.classList.remove('active'); resetTestState(); }
    else { learnSection.classList.remove('active'); testSection.classList.add('active'); showTestSetup(); renderHistory(); }
    if(synth) synth.cancel();
    document.querySelectorAll('.playing').forEach(el=>el.classList.remove('playing'));
});
function resetTestState(){
    testSetup.style.display=''; testActiveArea.classList.remove('visible'); testResults.classList.remove('visible');
    testFeedback.classList.remove('visible','correct-all','partial','wrong-all'); testFeedback.textContent='';
    btnNext.classList.remove('visible'); inputSpelling.value=''; inputMeaning.value='';
    inputSpelling.className=''; inputMeaning.className=''; btnSubmit.disabled=false; btnSubmit.style.display='';
    btnPlayTest.classList.remove('playing');
}
function showTestSetup(){ resetTestState(); testSetup.style.display=''; testActiveArea.classList.remove('visible'); testResults.classList.remove('visible'); }

// ==================== 学习模式构建 ====================
function buildLearnCards(){
    learnGrid.innerHTML='';
    wordData.forEach(w => {
        const card = document.createElement('div'); card.className='word-card';
        card.innerHTML = `
            <div class="word-card-top"><div><span class="word-headword">${w.word}</span><span class="word-ipa"> ${w.ipa}</span></div><button class="btn-play btn-play-card" data-word="${w.word}">▶</button></div>
            <div><span class="word-pos">${w.pos}</span> <span class="word-meaning">${w.meaning}</span></div>
            <div class="word-detail"><div class="word-detail-row"><strong>📎 常见词组/句型：</strong>${w.phrases}</div><div class="word-detail-example">📖 ${w.example}</div></div>
            <div class="card-collapse-hint">点击卡片收起详情 ▲</div>`;
        card.addEventListener('click', function(e){
            if(e.target.closest('.btn-play-card')) return;
            const wasExpanded = card.classList.contains('expanded');
            document.querySelectorAll('.word-card.expanded').forEach(c=>c.classList.remove('expanded'));
            if(!wasExpanded){ card.classList.add('expanded'); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
        });
        card.querySelector('.btn-play-card').addEventListener('click', function(e){
            e.stopPropagation();
            document.querySelectorAll('.btn-play.playing').forEach(b=>b.classList.remove('playing'));
            this.classList.add('playing');
            speakWord(w.word, ()=>this.classList.remove('playing'));
        });
        learnGrid.appendChild(card);
    });
}
buildLearnCards();
document.addEventListener('click', function(e){
    if(currentMode!=='learn') return;
    if(!e.target.closest('.word-card')) document.querySelectorAll('.word-card.expanded').forEach(c=>c.classList.remove('expanded'));
});

// ==================== 检测模式 ====================
let testWords=[], testCurrentIndex=0, testScore=0, testResultsData=[], testSubmitted=false;
function shuffleArray(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
btnStartTest.addEventListener('click', ()=>{
    testWords = shuffleArray(wordData).slice(0, TOTAL_QUESTIONS);
    testCurrentIndex=0; testScore=0; testResultsData=[]; testSubmitted=false;
    testSetup.style.display='none'; testActiveArea.classList.add('visible'); testResults.classList.remove('visible');
    testFeedback.classList.remove('visible','correct-all','partial','wrong-all'); testFeedback.textContent='';
    btnNext.classList.remove('visible'); btnSubmit.disabled=false; btnSubmit.style.display='';
    inputSpelling.value=''; inputMeaning.value=''; inputSpelling.className=''; inputMeaning.className='';
    btnPlayTest.classList.remove('playing'); updateTestProgress(); setTimeout(()=>playCurrentWord(),400);
});
function updateTestProgress(){
    testProgressLabel.textContent = `第 ${testCurrentIndex+1} / ${TOTAL_QUESTIONS} 题`;
    testScoreLabel.textContent = `得分: ${testScore}`;
    progressBarFill.style.width = Math.round((testCurrentIndex/TOTAL_QUESTIONS)*100)+'%';
}
function playCurrentWord(){ if(testCurrentIndex>=testWords.length) return; btnPlayTest.classList.add('playing'); speakWord(testWords[testCurrentIndex].word, ()=>btnPlayTest.classList.remove('playing')); }
btnPlayTest.addEventListener('click', ()=>{ if(!testSubmitted) playCurrentWord(); });

function submitAnswer(){
    if(testSubmitted || testCurrentIndex>=testWords.length) return;
    testSubmitted=true; btnSubmit.disabled=true;
    const w = testWords[testCurrentIndex];
    const userSpelling = inputSpelling.value.trim();
    const userMeaning = inputMeaning.value.trim();
    const spellingCorrect = userSpelling.toLowerCase() === w.word.toLowerCase();
    let meaningCorrect = false;
    if(userMeaning.length>0){
        const userCN = userMeaning.replace(/\s+/g,'');
        for(const accept of w.acceptCN){ if(userCN.includes(accept)||accept.includes(userCN)){ meaningCorrect=true; break; } }
        if(!meaningCorrect){
            const meaningClean = w.meaning.replace(/[；;，,、\s]/g,'');
            if(userCN.includes(meaningClean.substring(0,Math.min(3,meaningClean.length)))||meaningClean.includes(userCN)) meaningCorrect=true;
        }
    }
    inputSpelling.className = spellingCorrect ? 'correct-input' : 'wrong-input';
    inputMeaning.className = meaningCorrect ? 'correct-input' : 'wrong-input';
    const earned = (spellingCorrect&&meaningCorrect)?1:0;
    if(earned) testScore++;
    testFeedback.classList.add('visible');
    if(spellingCorrect&&meaningCorrect){
        testFeedback.classList.add('correct-all'); testFeedback.classList.remove('partial','wrong-all');
        testFeedback.innerHTML = `✅ <strong>完全正确！</strong><br>${w.word} — ${w.meaning}`;
    } else if(!spellingCorrect && !meaningCorrect){
        testFeedback.classList.add('wrong-all'); testFeedback.classList.remove('correct-all','partial');
        testFeedback.innerHTML = `❌ <strong>拼写和含义均不正确</strong><br>📝 正确拼写：<strong>${w.word}</strong>（你的：${userSpelling||'未填'}）<br>🈶 正确含义：<strong>${w.meaning}</strong>（你的：${userMeaning||'未填'}）`;
    } else if(!spellingCorrect){
        testFeedback.classList.add('partial'); testFeedback.classList.remove('correct-all','wrong-all');
        testFeedback.innerHTML = `⚠️ <strong>含义正确，拼写有误</strong><br>📝 正确拼写：<strong>${w.word}</strong>（你的：${userSpelling||'未填'}）<br>🈶 含义：${w.meaning} ✅`;
    } else {
        testFeedback.classList.add('partial'); testFeedback.classList.remove('correct-all','wrong-all');
        testFeedback.innerHTML = `⚠️ <strong>拼写正确，含义有误</strong><br>📝 ${w.word} ✅<br>🈶 正确含义：<strong>${w.meaning}</strong>（你的：${userMeaning||'未填'}）`;
    }
    testResultsData.push({ word:w.word, ipa:w.ipa, meaning:w.meaning, userSpelling, userMeaning, spellingCorrect, meaningCorrect, earned });
    updateTestProgress();
    btnNext.classList.add('visible'); btnSubmit.style.display='none';
    testFeedback.scrollIntoView({behavior:'smooth',block:'nearest'});
}
btnSubmit.addEventListener('click', submitAnswer);
inputMeaning.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!testSubmitted) submitAnswer(); });
inputSpelling.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!testSubmitted) inputMeaning.focus(); });
btnNext.addEventListener('click', ()=>{
    testCurrentIndex++; testSubmitted=false;
    if(testCurrentIndex>=testWords.length){ showFinalResults(); return; }
    inputSpelling.value=''; inputMeaning.value=''; inputSpelling.className=''; inputMeaning.className='';
    testFeedback.classList.remove('visible','correct-all','partial','wrong-all'); testFeedback.textContent='';
    btnNext.classList.remove('visible'); btnSubmit.disabled=false; btnSubmit.style.display='';
    updateTestProgress(); setTimeout(()=>playCurrentWord(),300); inputSpelling.focus();
});
function showFinalResults(){
    testActiveArea.classList.remove('visible'); testResults.classList.add('visible');
    const earnedTotal = testResultsData.reduce((s,r)=>s+r.earned,0);
    const percent = Math.round((earnedTotal/TOTAL_QUESTIONS)*100);
    resultsScore.textContent = `${earnedTotal} / ${TOTAL_QUESTIONS}`;
    resultsDetail.textContent = `正确率 ${percent}% — ${percent>=80?'🎉 非常棒！':percent>=60?'👍 不错，继续加油！':'💪 需要更多练习，加油！'}`;
    resultsTableBody.innerHTML='';
    testResultsData.forEach((r,i)=>{
        const tr = document.createElement('tr'); tr.className = r.earned ? 'row-correct' : 'row-wrong';
        const icon = r.earned ? '✅' : (r.spellingCorrect||r.meaningCorrect?'⚠️':'❌');
        tr.innerHTML = `<td>${i+1}</td><td><strong>${r.word}</strong> <span style="color:#888;font-size:0.8rem;">${r.ipa}</span><br><span style="font-size:0.8rem;">${r.meaning}</span></td><td style="color:${r.spellingCorrect?'#3a7d5a':'#c0392b'}">${r.userSpelling||'—'}</td><td style="color:${r.meaningCorrect?'#3a7d5a':'#c0392b'}">${r.userMeaning||'—'}</td><td>${icon}</td>`;
        resultsTableBody.appendChild(tr);
    });
    saveHistory({ timestamp:Date.now(), score:earnedTotal, total:TOTAL_QUESTIONS, percent });
    testResults.scrollIntoView({behavior:'smooth',block:'start'});
}
btnRetry.addEventListener('click', ()=>{
    testResults.classList.remove('visible'); testActiveArea.classList.add('visible');
    testWords = shuffleArray([...wordData]); testCurrentIndex=0; testScore=0; testResultsData=[]; testSubmitted=false;
    inputSpelling.value=''; inputMeaning.value=''; inputSpelling.className=''; inputMeaning.className='';
    testFeedback.classList.remove('visible','correct-all','partial','wrong-all'); testFeedback.textContent='';
    btnNext.classList.remove('visible'); btnSubmit.disabled=false; btnSubmit.style.display='';
    btnPlayTest.classList.remove('playing'); updateTestProgress(); setTimeout(()=>playCurrentWord(),400);
});
btnBackToSetup.addEventListener('click', ()=>{ showTestSetup(); testResults.classList.remove('visible'); renderHistory(); });
btnClearHistory.addEventListener('click', clearHistory);
document.addEventListener('keydown', function(e){
    if(currentMode!=='test'||testResults.classList.contains('visible')) return;
    if(testActiveArea.classList.contains('visible') && !testSubmitted){
        if(e.key===' ' && document.activeElement!==inputSpelling && document.activeElement!==inputMeaning){ e.preventDefault(); playCurrentWord(); }
    }
});
renderHistory();
})();
</script>
