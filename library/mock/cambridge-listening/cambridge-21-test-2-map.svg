<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 552" role="img" aria-label="Melby Coal Mine map">
  <style>
    .lbl { font: 700 22px Arial, Helvetica, sans-serif; fill: #111; }
    .name { font: 600 15px Arial, Helvetica, sans-serif; fill: #111; }
    .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111; }
    .legend { font: 600 14px Arial, Helvetica, sans-serif; fill: #111; }
    .box { fill: #fff; stroke: #111; stroke-width: 2.5; }
    .site { fill: none; stroke: #111; stroke-width: 3; }
    .walk { fill: none; stroke: #111; stroke-width: 2; stroke-dasharray: 8 6; }
  </style>
  <rect width="1024" height="552" fill="#fff"/>
  <text class="title" x="512" y="42" text-anchor="middle">Melby Coal Mine</text>

  <!-- compass -->
  <g transform="translate(78 108)" stroke="#111" stroke-width="2.5" fill="none">
    <path d="M0 26 L0 -8 M-8 0 L8 0"/>
    <path d="M0 -8 L-5 2 M0 -8 L5 2" fill="#111" stroke="#111"/>
    <text class="legend" x="-2" y="-16" text-anchor="middle">N</text>
    <text class="legend" x="-2" y="44" text-anchor="middle">S</text>
    <text class="legend" x="-28" y="8" text-anchor="middle">W</text>
    <text class="legend" x="28" y="8" text-anchor="middle">E</text>
  </g>

  <!-- legend -->
  <line class="walk" x1="250" y1="98" x2="330" y2="98"/>
  <text class="legend" x="340" y="103">Covered walkway</text>

  <!-- site boundary -->
  <rect class="site" x="34" y="72" width="956" height="456" rx="2"/>

  <!-- A -->
  <rect class="box" x="52" y="318" width="78" height="182"/>
  <text class="lbl" x="91" y="418" text-anchor="middle">A</text>

  <!-- B -->
  <rect class="box" x="52" y="96" width="58" height="58"/>
  <text class="lbl" x="81" y="133" text-anchor="middle">B</text>

  <!-- Engine house + C -->
  <rect class="box" x="148" y="338" width="98" height="54"/>
  <text class="name" x="197" y="370" text-anchor="middle">Engine house</text>
  <rect class="box" x="254" y="338" width="88" height="54"/>
  <text class="lbl" x="298" y="372" text-anchor="middle">C</text>

  <!-- D (L-shaped) -->
  <path class="box" d="M334 96 h86 v52 h-34 v74 h-52 z"/>
  <text class="lbl" x="376" y="152" text-anchor="middle">D</text>

  <!-- E (L-shaped) -->
  <path class="box" d="M362 248 h120 v44 h-44 v92 h-76 z"/>
  <text class="lbl" x="416" y="314" text-anchor="middle">E</text>

  <!-- F / G / visitor centre -->
  <rect class="box" x="428" y="386" width="58" height="118"/>
  <text class="lbl" x="457" y="452" text-anchor="middle">F</text>
  <rect class="box" x="486" y="386" width="72" height="118"/>
  <text class="lbl" x="522" y="452" text-anchor="middle">G</text>
  <rect class="box" x="558" y="386" width="78" height="118"/>
  <text class="name" x="597" y="448" text-anchor="middle">Ticket</text>
  <text class="name" x="597" y="468" text-anchor="middle">office</text>
  <text class="name" x="514" y="522" text-anchor="middle">Main visitor centre</text>

  <!-- I -->
  <rect class="box" x="724" y="304" width="58" height="58"/>
  <text class="lbl" x="753" y="340" text-anchor="middle">I</text>

  <!-- H -->
  <rect class="box" x="724" y="92" width="132" height="132"/>
  <text class="lbl" x="790" y="164" text-anchor="middle">H</text>

  <!-- Car park -->
  <rect class="box" x="724" y="396" width="128" height="136"/>
  <text class="name" x="788" y="472" text-anchor="middle">Car park</text>

  <!-- covered walkways -->
  <path class="walk" d="M724 464 H558"/>
  <path class="walk" d="M597 386 V248"/>
  <path class="walk" d="M788 396 V362"/>
  <path class="walk" d="M753 304 V224"/>
  <path class="walk" d="M753 224 H790"/>
  <path class="walk" d="M428 430 H298"/>
  <path class="walk" d="M298 430 V392"/>
  <path class="walk" d="M298 392 L254 365"/>
  <path class="walk" d="M457 386 V318 L362 268"/>
</svg>
