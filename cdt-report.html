<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/tenant-boot.js?v=20260728ease1"></script>
  <script src="assets/js/page-transit.js?v=20260724p1"></script>
  <title>模考报告 · 优益思达</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/cdt-report.css?v=20260723r1">
</head>
<body class="cdt-report">

  <header class="cdt-report__bar">
    <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="cdt-report__logo" aria-hidden="true">
    <div class="cdt-report__bar-text">
      <h1 id="rpt-title">IELTS Mock Report</h1>
      <p id="rpt-sub">Listening · Reading · Writing</p>
    </div>
    <a class="cdt-report__link" href="cambridge.html" id="rpt-back">返回套题</a>
  </header>

  <main class="cdt-report__main">
    <section class="cdt-report__skills" id="rpt-skills" aria-label="三科成绩"></section>
    <div class="cdt-report__acts" id="rpt-wrong-acts" hidden style="margin:12px 0 8px"></div>

    <section class="cdt-report__writing" id="rpt-writing" hidden>
      <h2>Writing</h2>
      <p class="cdt-report__note">AI 估分仅供练习参考，非正式考分。也可复制全文发给老师批改。</p>
      <div class="cdt-report__acts">
        <button type="button" class="cdt-report__btn cdt-report__btn--primary" id="rpt-ai-t1">AI 批改 Task 1（含范文）</button>
        <button type="button" class="cdt-report__btn cdt-report__btn--primary" id="rpt-ai-t2">AI 批改 Task 2（含范文）</button>
        <button type="button" class="cdt-report__btn" id="rpt-copy">复制全文发给老师</button>
      </div>
      <p class="cdt-report__hint" id="rpt-hint" aria-live="polite"></p>
      <div class="cdt-report__essays">
        <details open>
          <summary>Your Task 1</summary>
          <pre id="rpt-essay-t1" class="cdt-report__pre"></pre>
        </details>
        <details open>
          <summary>Your Task 2</summary>
          <pre id="rpt-essay-t2" class="cdt-report__pre"></pre>
        </details>
      </div>
      <div class="cdt-report__grade" id="rpt-grade-t1" hidden></div>
      <div class="cdt-report__grade" id="rpt-grade-t2" hidden></div>
    </section>

    <section class="cdt-report__foot-acts">
      <a class="cdt-report__btn" id="rpt-retry" href="#">再考本套</a>
      <a class="cdt-report__btn" href="results.html">全部成绩记录</a>
    </section>
  </main>

  <script src="assets/js/config.js?v=20260724p1"></script>
  <script src="assets/js/auth.js?v=20260806report"></script>
  <script src="assets/js/cdt-report.js?v=20260731p1"></script>
</body>
</html>
