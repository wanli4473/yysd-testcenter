<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="优益思达托福题库中心 · 教师题目审阅、预测包与已有试卷管理">
  <title>题库中心 · 优益思达</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23da3025'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='%23fff' font-size='22' font-family='Helvetica Neue,Helvetica,Arial,PingFang SC,sans-serif'%3E优%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="tiku.css?v=20261027grant2">
  <script src="gate.js?v=20261015prev1"></script>
</head>
<body>
  <div id="gate" class="gate hidden">
    <div class="auth-card">
      <h1>题库中心</h1>
      <p class="lede">请使用老师端打开。安装包不在网站上，由总部私下发给你。</p>
    </div>
  </div>
  <div id="login" class="login hidden">
    <div class="auth-card">
      <h1>题库中心</h1>
      <p class="lede">教师账号登录。仅总部开通的老师、且在指定网络可用。</p>
      <form id="login-form">
        <label class="f"><span>手机号</span><input id="phone" type="tel" maxlength="11" autocomplete="username"></label>
        <label class="f"><span>密码</span><input id="password" type="password" autocomplete="current-password"></label>
        <label class="f"><span>激活码</span><input id="activationCode" autocomplete="off" placeholder="这台电脑已绑定可留空"></label>
        <button class="btn primary" type="submit">登录</button>
        <p class="msg-f" id="login-msg" role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
    </div>
  </div>
  <div id="app" class="wrap hidden">
    <header class="top">
      <div class="brand">
        <h1>题库中心</h1>
        <span class="sub">TOEFL Studio</span>
      </div>
      <div class="row">
        <span class="who" id="who"></span>
        <button type="button" class="btn ghost" id="refresh">刷新</button>
        <button type="button" class="btn ghost" id="out">退出</button>
      </div>
    </header>
    <nav class="tabs" id="tabs" aria-label="题库工作台导航"></nav>
    <p class="msg" id="msg" role="status" aria-live="polite" aria-atomic="true"></p>
    <main id="main"></main>
  </div>
  <script src="https://app.youyisida.com/assets/js/reading.js?v=20261016prediction1"></script>
  <script src="tiku.js?v=20261027grant2"></script>
</body>
</html>
