<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师登录 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260722polish">
  <link rel="stylesheet" href="assets/css/dashboard-premium.css?v=20260722polish">
  <script>
  /* ponytail: 分网站统一登录，避免 teacher-login 闪出优益思达品牌 */
  (function () {
    try {
      var q = new URLSearchParams(location.search).get("tenant");
      if (q && /^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$/.test(q)) {
        location.replace("login.html?next=" + encodeURIComponent(
          new URLSearchParams(location.search).get("next") || "teacher.html"
        ));
        return;
      }
    } catch (e) {}
    var h = (location.hostname || "").toLowerCase();
    if (h && h !== "localhost" && h !== "127.0.0.1" &&
        h !== "youyisida.com" && h !== "www.youyisida.com") {
      var m = h.match(/^([a-z0-9-]+)\.youyisida\.com$/);
      if (m && !/^(www|api|admin|platform|mail|static|cdn|test|dev|staging)$/.test(m[1])) {
        location.replace("login.html?next=" + encodeURIComponent(
          new URLSearchParams(location.search).get("next") || "teacher.html"
        ));
      }
    }
  })();
  </script>
</head>
<body class="home-minimal teacher-auth-page">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="index.html" class="minimal-brand" aria-label="优益思达国际课程中心首页">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>Teacher Portal</span>
        </span>
      </a>
      <nav class="minimal-nav" aria-label="教师导航">
        <a href="index.html">返回学生端</a>
        <a href="teacher-login.html" class="is-active">教师登录</a>
      </nav>
    </div>
  </header>

  <main class="minimal-shell minimal-main auth-main">
    <div class="auth-layout">
      <aside class="auth-aside reveal" aria-label="教师端介绍">
        <div class="auth-aside__logo" aria-hidden="true">
          <img src="assets/img/logo.svg?v=20260702-logo" alt="">
        </div>
        <span class="auth-aside__eyebrow">YYSD · TEACHER</span>
        <h2 class="auth-aside__title">教师端<br>学情一览</h2>
        <p class="auth-aside__desc">查看学生模考与练习成绩，掌握整体备考进度。</p>
        <ul class="auth-aside__points">
          <li>学生成绩汇总</li>
          <li>模考记录追踪</li>
          <li>按板块筛选</li>
        </ul>
      </aside>
      <section class="auth-card reveal">
        <div class="auth-tabs">
          <span class="auth-tabs__item is-active">登录</span>
          <a class="auth-tabs__item" href="teacher-register.html">注册</a>
        </div>
        <h1 class="auth-card__title">教师登录</h1>
        <p class="auth-card__desc">使用教师账号的手机号与密码登录。</p>

        <form class="auth-form" id="login-form" novalidate>
          <label class="auth-field">
            <span>手机号</span>
            <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="11 位中国大陆手机号" required>
          </label>
          <label class="auth-field">
            <span>密码</span>
            <input type="password" id="password" autocomplete="current-password" minlength="6" maxlength="64" placeholder="至少 6 位" required>
          </label>
          <p class="auth-forgot"><a href="forgot-password.html">忘记密码？</a></p>
          <p class="auth-msg" id="msg" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn--primary btn--block pressable">进入教师端</button>
        </form>

        <p class="auth-legal">
          还没有教师账号？<a href="teacher-register.html">注册教师账号</a>
          · <a href="login.html">学生登录</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心 · 教师端</p>
    </div>
  </footer>

  <script src="assets/js/teacher-auth.js?v=20260801wl1"></script>
  <script src="assets/js/ui.js?v=20260702f"></script>
  <script>
  (function () {
    var T = window.YYSD_TEACHER;
    var form = document.getElementById("login-form");
    var phoneEl = document.getElementById("phone");
    var passwordEl = document.getElementById("password");
    var msgEl = document.getElementById("msg");
    var next = new URLSearchParams(location.search).get("next") || "teacher.html";

    if (T.getToken()) {
      location.replace(next.indexOf("teacher-login") !== -1 ? "teacher.html" : next);
      return;
    }

    document.getElementById("year").textContent = new Date().getFullYear();

    function showMsg(text, ok) {
      msgEl.textContent = text || "";
      msgEl.className = "auth-msg" + (ok ? " auth-msg--ok" : text ? " auth-msg--err" : "");
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      showMsg("");
      T.api("/api/teacher/login", {
        method: "POST",
        body: { phone: phoneEl.value.trim(), password: passwordEl.value }
      })
        .then(function (d) {
          T.setToken(d.token);
          T.setTeacher(d.teacher || { phone: phoneEl.value.trim() });
          try {
            var teacher = d.teacher || {};
            localStorage.setItem("yysd:auth:user", JSON.stringify({
              phone: teacher.phone || phoneEl.value.trim(),
              role: "teacher",
              displayName: teacher.name || "",
              avatarUrl: teacher.avatarUrl || "",
              isAdmin: !!teacher.isAdmin,
              isPlatformAdmin: !!teacher.isPlatformAdmin
            }));
            localStorage.setItem("yysd:teacher:user", JSON.stringify({
              phone: teacher.phone || phoneEl.value.trim(),
              name: teacher.name || "",
              avatarUrl: teacher.avatarUrl || "",
              isAdmin: !!teacher.isAdmin,
              isPlatformAdmin: !!teacher.isPlatformAdmin
            }));
          } catch (e) {}
          location.href = next;
        })
        .catch(function (e) { showMsg(e.message); });
    });
  })();
  </script>
</body>
</html>
