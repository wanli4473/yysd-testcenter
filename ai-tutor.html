<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 雅思老师 · 优益思达国际课程中心</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20260714shell">
  <link rel="stylesheet" href="assets/css/ai-tutor.css?v=20260714c">
  <link rel="stylesheet" href="assets/css/mascot.css?v=20260709a">
</head>
<body class="home-minimal student-layout shell-compact-nav ai-tutor-page">

  <header class="minimal-topbar">
    <div class="minimal-shell minimal-topbar__inner">
      <a href="dashboard.html" class="minimal-brand" aria-label="工作台">
        <img src="assets/img/logo.svg?v=20260702-logo" alt="" class="minimal-brand__logo">
        <span class="minimal-brand__text">
          <b>优益思达国际课程中心</b>
          <span>YYSD International Course Center</span>
        </span>
      </a>
      <nav class="minimal-nav" id="nav" aria-label="主导航">
        <a href="dashboard.html" data-nav="dashboard">工作台</a>
        <a href="zone.html?zone=study" data-zone="study">学习区</a>
        <a href="zone.html?zone=practice" data-zone="practice" class="is-active">练习区</a>
        <a href="zone.html?zone=mock" data-zone="mock">模考区</a>
        <a href="calendar.html" data-nav="calendar">任务日历</a>
        <a href="results.html" data-nav="results">我的成绩</a>
        <a href="login.html" id="nav-auth">登录</a>
      </nav>
    </div>
  </header>

  <section class="minimal-shell minimal-page-head">
    <div class="minimal-crumb"><a href="zone.html?zone=practice">练习区</a> <span class="crumb-sep" aria-hidden="true">★</span> <span>AI 雅思老师</span></div>
    <h1>AI 雅思老师</h1>
    <p class="minimal-page-desc">机经练习 / 全真模考，或向老师请教口语与写作。支持文字与语音。</p>
  </section>

  <main class="minimal-shell minimal-main ai-tutor" id="ai-tutor-root">
    <aside class="ai-tutor__side" aria-label="历史会话">
      <div class="ai-tutor__side-head">
        <strong>历史会话</strong>
        <button type="button" class="btn btn--primary btn--sm" id="btn-new">新建辅导</button>
      </div>
      <div class="ai-tutor__quota" id="quota-box">加载额度…</div>
      <ul class="ai-tutor__sessions" id="session-list"></ul>
      <div class="ai-tutor__admin" id="admin-upload" hidden>
        <strong>更新机经题库</strong>
        <input type="file" id="jiijing-file" accept="application/pdf,.pdf">
        <button type="button" class="btn btn--ghost btn--sm" id="btn-upload-jiijing">上传 PDF</button>
        <p class="ai-tutor__admin-hint" id="upload-hint"></p>
      </div>
    </aside>

    <section class="ai-tutor__main">
      <div class="ai-tutor__toolbar">
        <div class="ai-tutor__modes" role="group" aria-label="模式">
          <button type="button" class="chip is-active" data-mode="teacher">辅导老师</button>
          <button type="button" class="chip" data-mode="examiner">口语考官</button>
        </div>
        <div class="ai-tutor__exam" id="exam-opts" hidden>
          <button type="button" class="chip chip--sub is-active" data-exam-mode="practice">机经练习</button>
          <button type="button" class="chip chip--sub" data-exam-mode="mock">机经模考</button>
        </div>
        <div class="ai-tutor__prep" id="prep-bar" hidden>
          <span id="prep-label">Part 2 准备</span>
          <strong id="prep-time">01:00</strong>
          <button type="button" class="btn btn--ghost btn--sm" id="btn-prep">开始 60 秒准备</button>
        </div>
      </div>

      <div class="ai-tutor__picker" id="topic-picker" hidden>
        <div class="ai-tutor__bank-title" id="bank-title">机经题库</div>
        <div class="ai-tutor__pick-cols">
          <div>
            <h3>Part 1（可多选）</h3>
            <div class="ai-tutor__pick-list" id="part1-list"></div>
          </div>
          <div>
            <h3>Part 2（单选，含 Part 3）</h3>
            <div class="ai-tutor__pick-list" id="part2-list"></div>
          </div>
        </div>
        <div class="ai-tutor__pick-actions">
          <button type="button" class="btn btn--primary" id="btn-start-practice">开始练习</button>
          <button type="button" class="btn btn--primary" id="btn-start-mock" hidden>开始模考（随机抽题）</button>
        </div>
      </div>

      <div class="ai-tutor__messages" id="messages" aria-live="polite"></div>

      <div class="ai-tutor__composer">
        <p class="ai-tutor__hint" id="status-hint"></p>
        <div class="ai-tutor__input-row">
          <textarea id="input" rows="2" placeholder="输入消息…（写作可直接粘贴作文）" maxlength="8000"></textarea>
          <button type="button" class="btn btn--ghost ai-tutor__mic" id="btn-mic" aria-pressed="false" title="点一下开始录音，再点结束">🎤</button>
          <button type="button" class="btn btn--primary" id="btn-send">发送</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="minimal-footer minimal-footer--rich">
    <div class="minimal-shell minimal-footer__inner">
      <p class="minimal-footer__copy">© <span id="year"></span> 优益思达国际课程中心
        <span class="site-icp" data-icp></span>
      </p>
    </div>
  </footer>

  <script src="assets/js/config.js?v=20260714canvas"></script>
  <script src="assets/js/auth.js?v=20260714localapi"></script>
  <script src="assets/js/nav.js?v=20260714dash"></script>
  <script src="assets/js/ui.js?v=20260702f"></script>
  <script src="assets/js/ai-tutor.js?v=20260714c"></script>
  <script src="assets/js/mascot.js?v=20260709a"></script>
</body>
</html>
