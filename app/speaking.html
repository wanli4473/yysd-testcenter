<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speaking</title>
  <script src="assets/js/gate.js?v=20261020gate1"></script>
  <script src="assets/js/auth.js?v=20261015prev1"></script>
  <script src="assets/js/access.js?v=20261014kl1"></script>
</head>
<body>
  <script>
    (function () {
      var A = window.YYSD_APP;
      if (A && A.requireLogin && !A.requireLogin("speaking.html" + location.search)) return;
      function go() {
        var q = new URLSearchParams(location.search);
        if (!q.get("mode")) q.set("mode", "practice");
        if (!q.get("from")) q.set("from", "app");
        var root = location.pathname.indexOf("/app/") >= 0 ? "../" : "";
        location.replace(root + "toefl-speaking.html?" + q.toString());
      }
      if (window.YYSD_ACCESS && YYSD_ACCESS.paper) {
        YYSD_ACCESS.paper(function () {}).then(function (ok) { if (ok) go(); });
      } else go();
    })();
  </script>
</body>
</html>
