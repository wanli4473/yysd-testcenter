<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 机考系统</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261015swiss1">
  <script src="assets/js/gate.js?v=20261020gate1"></script>
  <script src="assets/js/auth.js?v=20261008ui15"></script>
  <script src="../assets/js/toefl-sync.js?v=20261027rec2"></script>
</head>
<body class="auth-page">
  <header class="top"><b>优益思达机考系统<small lang="en">YYSD TEST CENTER</small></b>
    <span class="top-acts"><button type="button" id="hit-reload">刷新</button></span>
  </header>
  <main class="shell">
    <div class="card">
      <p class="auth-eyebrow" lang="en">SIGN IN</p>
      <h1>登录</h1>
      <p class="lead">手机号和密码登录。新用户请先注册。</p>
      <form id="f">
        <label class="field">手机号
          <input type="tel" id="phone" maxlength="11" inputmode="numeric" autocomplete="tel" required>
        </label>
        <label class="field">密码
          <input type="password" id="password" minlength="6" autocomplete="current-password">
        </label>
        <label class="field">激活码
          <input id="activationCode" autocomplete="off" placeholder="这台电脑已绑定可留空">
        </label>
        <p class="msg" id="msg"></p>
        <button class="btn btn-block" type="submit">进入机考</button>
      </form>
      <p class="auth-switch">还没有账号？<a href="register.html">用激活码注册</a></p>
    </div>
  </main>
  <script>
    (function () {
      var A = window.YYSD_APP;
      var next = new URLSearchParams(location.search).get("next") || "home.html";
      if (A.token()) { location.replace(next); return; }
      A.bindReload(document.getElementById("hit-reload"));
      document.getElementById("f").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var msg = document.getElementById("msg");
        msg.textContent = "";
        A.api("/api/auth/login", {
          method: "POST",
          body: {
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value,
            activationCode: document.getElementById("activationCode").value.trim()
          }
        }).then(function (d) {
          A.applyLogin(d);
          var flush = (window.YYSD_TOEFL_SYNC && YYSD_TOEFL_SYNC.flush) ? YYSD_TOEFL_SYNC.flush() : Promise.resolve();
          flush.finally(function () { location.replace(next); });
        }).catch(function (e) {
          msg.textContent = e.message || "登录失败";
        });
      });
    })();
  </script>
</body>
</html>
